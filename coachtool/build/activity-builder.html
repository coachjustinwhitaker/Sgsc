<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#222;background:#f6f7fa}
main{max-width:680px;margin:0 auto;padding:16px}h1{font-size:22px;margin:6px 0 4px}h2{font-size:17px;margin:22px 0 8px}
p.lead{color:#6b7280;margin:0 0 14px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:14px;margin:10px 0}
label.t{display:block;font-weight:600;margin:14px 0 4px}small{color:#6b7280;font-weight:400}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px;font:inherit;border:1px solid #c9d0db;border-radius:8px;background:#fff}
textarea{min-height:96px}.row{display:flex;gap:10px}.row>*{flex:1}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}.chk label{font-weight:400;display:flex;align-items:center;gap:5px;margin:0}
button{font:inherit;font-weight:700;padding:12px 16px;border:0;border-radius:10px;background:#1f3a68;color:#fff;margin-top:14px;cursor:pointer}
button.sec{background:#fff;color:#1f3a68;border:1px solid #1f3a68}button.sm{padding:6px 10px;margin:0;font-size:14px}
.warn{background:#fff6e0;border:1px solid #f0d28a;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.err{background:#fde8e8;border:1px solid #f1a9a9;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eef0f4}
img.pv{max-width:100%;border-radius:8px;margin-top:8px}
</style></head><body><main>
<h1>Activity Builder</h1>
<p class="lead">Add a new activity, or load an existing one to edit it. Add each to the batch, then download the batch and send it over to be imported.</p>
<div class="card"><label class="t">Edit an existing activity <small>(optional)</small></label><select id="load"></select></div>
<div class="card">
<label class="t">Name</label><input type="text" id="name">
<label class="t">Block</label><select id="block"></select>
<label class="t">Ages</label><div class="chk" id="ages"></div>
<label class="t">Tracks <small>(rec = recreational, comp = competitive)</small></label><div class="chk" id="tracks"></div>
<label class="t">Levels</label><div class="chk" id="levels"></div>
<div id="fit"></div>
<label class="t">Skills <small>(tags already used in the library)</small></label><div class="chk" id="skills"></div>
<input type="text" id="newskills" placeholder="New skill tags, separated by commas" style="margin-top:8px">
<div class="row"><div><label class="t">Players, min</label><input type="number" id="pmin" min="2" max="30"></div><div><label class="t">Players, max</label><input type="number" id="pmax" min="2" max="30"></div><div><label class="t">Minutes</label><input type="number" id="min" min="5" max="45" value="15"></div></div>
<label class="t">Space <small>(the smallest space it works in)</small></label><select id="space"></select>
<label class="t">Setup <small>(layout, who starts where, how it restarts, progression)</small></label><textarea id="setup"></textarea>
<label class="t">What to look for</label><textarea id="look_for"></textarea>
<label class="t">Question to ask the players</label><input type="text" id="question">
<label class="t">Equipment</label><input type="text" id="equipment" placeholder="1 ball per group · 4 cones · Pinnies">
<label class="t">Pairs well with <small>(optional)</small></label><div class="chk" id="pairs"></div>
<label class="t">Diagram <small>(PNG, JPG, WebP or SVG)</small></label><input type="file" id="file" accept="image/*"><div id="pv"></div>
<div id="msg"></div>
<button id="add">Add to batch</button> <button class="sec" id="clear">Clear form</button>
</div>
<h2>Batch</h2><div class="card" id="batch"></div>
<button id="dl">Download batch</button> <button class="sec" id="cp">Copy batch</button>
</main>
<script>
const D = {"activities": [{"id": "flying-numbers", "order": 1, "name": "Flying Numbers", "block": "B1", "skills": ["Decision-Making", "Variable Pressure"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "half", "minutes": 15, "setup": "Mark space with cones, small goals on both sides. Two teams along the touchline either side of you. Call a number combo (1v1, 2v1, 2v2, 3v2) and each side sends in that number to scrimmage. New players rotate in after every goal or ball out. Call different numbers from each side to create imbalanced situations.", "look_for": "The most adaptable game in the toolkit. If one player is dominating, play them 1v2. If a quieter player needs more touches, play the ball directly to them. You control the challenge level in real time. Works perfectly as an anchor activity because it never feels the same twice.", "question": "When you had more players than the other team, what did you do with that extra person?", "pairs_with": ["shrinking-field", "rondo", "1v1-to-endlines-goals"], "equipment": "1 ball · 2 goals · Disc cones · Pinnies"}, {"id": "shrinking-field", "order": 2, "name": "Shrinking Field", "block": "B1", "skills": ["First Touch", "Body Shape", "Pressure"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with goals at each end. 3v3 or 4v4. Every minute, move each touchline in by 3 steps. The field narrows progressively. Players must make decisions faster as space disappears. Team with most goals after 3 minutes wins the round. Play 2–3 rounds.", "look_for": "Players whose first touch opens their body, hips at 45 to 90 degrees toward goal, have more time in tight spaces. Players who receive square-on get pressed immediately. On the second visit, frame it as a defending focus: which team stays compact and presses together as the field shrinks?", "question": "As the field got smaller, what changed about when you decided to pass?", "pairs_with": ["flying-numbers", "rondo"], "equipment": "1 ball · 2 goals · Disc cones"}, {"id": "1v1-to-endlines-goals", "order": 3, "name": "1v1 to Endlines & Goals", "block": "B1", "skills": ["Dribbling", "Defending", "Control"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 14}, "space": "quarter", "minutes": 15, "setup": "1v1 to Endlines: small rectangle, score by dribbling ball over opponent’s end line within arm’s distance. Progress to 1v1 to Small Goals: add cone goals at each end, score below knee height. Pairs run simultaneously. Fast rotations. Keep multiple pairs active at once.", "look_for": "At U10 the focus shifts: not just beating the defender, but the decision: dribble or shoot? When is each the right answer? Players who look up to check for the goal before driving are already thinking ahead. Works well as an anchor because every player is active simultaneously.", "question": "When you got past your opponent, what made you decide to shoot rather than keep dribbling?", "pairs_with": ["gates-passing", "2v2-to-endlines-attacking"], "equipment": "1 ball per pair · 4 cones per game · Pinnies · Small goals optional"}, {"id": "rondo", "order": 4, "name": "Rondo", "block": "B1", "skills": ["Possession", "Body Shape", "Quick Passing"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 5, "max": 15}, "space": "quarter", "minutes": 15, "setup": "Square grid, one defender in the center, four attackers on the outside. This is called a rondo. Attackers keep the ball away from the defender. When the defender wins it or the ball goes out, the attacker who last touched it swaps into the middle. Keep track of consecutive passes. Progress: add a second defender (4v2) if passing is excellent, or drop to 3v1 to force attackers to move more.", "look_for": "Look for attackers spreading out to give the player with the ball multiple options. Players who bunch together make the defender's job easy. The player with the ball should always have at least two teammates they can see. On the receiving end, open hips give a player more time before the defender closes in.", "question": "When you were in the middle defending, what made it harder to win the ball? What made it easier?", "pairs_with": ["flying-numbers", "gates-passing"], "equipment": "1 ball per group · 4 cones per square · Pinnies for defenders", "aliases": ["4v2 Keep-Away"]}, {"id": "gates-passing", "order": 5, "name": "Gates Passing", "block": "B2", "skills": ["Passing", "Move After Passing", "Communication"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 16}, "space": "half", "minutes": 15, "setup": "Rectangular grid with 8–10 gates scattered throughout (two cones arm’s length apart). Players in pairs with one ball. Score by passing to each other through gates. After passing, move immediately to a new gate. Encourage players to tell their partner where they are going before they pass.", "look_for": "The pass-and-move habit is the entire point. A player who passes and stands still is not learning “Me & My Teammates.” Look for any player who moves after passing. Name it when you see it. Also look for open body shape on receiving. Progress: replace the gates with cone triangles scattered around the grid. Players score by passing through a triangle to their partner. Now add a challenge: tell your partner where you are going before you pass. The pair that communicates most will score the most.", "question": "After you passed the ball, what did you do next? Why does moving matter?", "pairs_with": ["flying-numbers", "rondo"], "equipment": "1 ball per pair · 8–10 tall cone gates · Disc cones for grid", "variants": [{"id": "triangle-goal-game", "name": "Triangle Goal Game", "note": "Progression: replace the gates with cone triangles. Players score by passing through a triangle to their partner."}]}, {"id": "end-zone-passing", "order": 6, "name": "End Zone Passing", "block": "B2", "skills": ["Supporting Runs", "Move Off the Ball", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with a small end zone marked at each end (about 4 yards deep). Two teams of 3 or 4. Players can dribble freely in the middle of the field, but the only way to score is to pass the ball to a teammate who has run into the opponent's end zone to receive it. The receiver must have both feet inside the end zone when they catch the ball.", "look_for": "This game makes movement off the ball essential. A team that stands still cannot score because no one is in the end zone to receive. Look for players who time their run to arrive as the ball is being played. Any player who calls for the ball while running into the end zone is showing real game intelligence. Celebrate those moments explicitly.", "question": "When did you run into the end zone? What were you watching to know when to go?", "pairs_with": ["gates-passing", "flying-numbers"], "equipment": "1 ball · Disc cones for grid and end zones · Pinnies"}, {"id": "numbers-passing", "order": 7, "name": "Numbers Passing", "block": "B2", "skills": ["Passing Sequence", "Body Shape", "Anticipation"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 8}, "space": "quarter", "minutes": 15, "setup": "Grid with 4 cones. Assign each player a number, their passing order. Players jog around the space passing in numbered order: 1 to 2, 2 to 3, until the last number passes back to 1. Add a second ball when they find a rhythm. Optional: add a goal. The last player shoots, then becomes the new number 1.", "look_for": "Look for players keeping hips open (not square-on), cushioning the ball softly, then taking a purposeful next touch. Players who are always looking for the next number before the ball arrives will stand out. That anticipation is body shape doing its job. Works well as a focus activity after Gates Passing.", "question": "How did you know where the next number was before the ball came to you?", "pairs_with": ["1v1-to-endlines-goals", "flying-numbers"], "equipment": "1 ball (2 when ready) · Disc cones for grid"}, {"id": "2v2-to-endlines-attacking", "order": 8, "name": "2v2 to Endlines — Attacking", "block": "B2", "skills": ["Spreading Out", "2v1 Situations"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Small rectangular space. Two attackers vs two defenders. Attackers score by dribbling ball over opponent’s end line within arm’s distance. Defenders can steal and score too. Rotate new players when scoring or ball out. Keep it fast. Run multiple games simultaneously.", "look_for": "Encourage the attacker with the ball to drive at one defender to commit them, while the second attacker finds open space. When they spread out and use that advantage, celebrate it. The moment a player passes around a committed defender, even once, is worth highlighting for the whole group.", "question": "When you had the ball and a defender coming at you, what options did you have?", "pairs_with": ["1v1-to-endlines-goals", "flying-numbers"], "equipment": "1 ball per game · 4 cones per game · Pinnies"}, {"id": "3v2-to-goal", "order": 9, "name": "3v2 to Goal", "block": "B2", "skills": ["Numerical Advantage", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 5, "max": 15}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid, small goal at one end. Three attackers from one end meet two defenders. Attackers work together to score. Defenders can score by dribbling over the end line. Remind attackers to spread out. Rotate defenders so they don’t get discouraged.", "look_for": "Do not explain the combination in advance. Run the game and watch it emerge. If a player dribbles at a defender to force commitment and then passes around them, freeze the moment briefly: “Did everyone see that? What happened there?” That is the whole concept in one moment.", "question": "When did you decide to pass rather than keep dribbling? What did you see that told you to pass?", "pairs_with": ["2v2-to-endlines-attacking", "flying-numbers"], "equipment": "1 ball · 1 small goal · Disc cones · Pinnies"}, {"id": "five-goal-game", "order": 10, "name": "Five Goal Game", "block": "B2", "skills": ["Finding New Paths", "Problem Solving"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with a cone goal in each corner plus one in the center, 5 goals total. 3v3 or 4v4. Players try to pass the ball through any goal to a teammate to score in any direction. Defenders protect all 5 goals and can only gain possession by intercepting or stealing.", "look_for": "Attackers must adapt quickly when their path is blocked. Players without the ball must move to open space near goals so their teammate has someone to find. Best as a focus activity later in the season when combination play is starting to click.", "question": "When the goal you were aiming for was blocked, what did you do?", "pairs_with": ["flying-numbers", "3v2-to-goal"], "equipment": "1 ball · 5 goal pairs (4 corners + 1 center) · Pinnies"}, {"id": "barcelona", "order": 11, "name": "Barcelona", "block": "B2", "skills": ["Patience", "Pass Counting", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with goals at each end. 3v3 or 4v4, no goalkeeper. Score points equal to the number of passes completed before scoring: 8 passes before a goal = 8 points. A missed shot scores nothing. Play short rounds of 3–4 minutes.", "look_for": "Teams that learn to move the ball patiently before shooting will outscore teams that rush. Watch for players who switch the ball to the far side before going to goal. That is combination play at its most sophisticated. Best as a focus activity late in the season when passing habits are forming.", "question": "Before you scored, was there a moment where you switched the ball to the other side? What did that open up?", "pairs_with": ["rondo-5v2", "five-goal-game"], "equipment": "1 ball · 2 small goals · Disc cones · Pinnies"}, {"id": "rondo-5v2", "order": 12, "name": "Rondo 5v2", "block": "B2", "skills": ["Quick Passing", "Body Shape", "Controlled Touches"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 7, "max": 14}, "space": "quarter", "minutes": 15, "setup": "Square of cones. Five attackers in a circle, two defenders in the center. Attackers keep the ball away. Track consecutive passes. Attacker who last touched an interception or ball out of bounds swaps with a defender. Rotate defenders every few minutes. Limit to 1–2 touches for extra challenge.", "look_for": "Where the Rondo (4v1) is a small tight game, this is the bigger version: more players, two defenders, faster decisions required. Quick touches and spreading the space are the two things to reinforce. Encourage attackers to draw a defender toward them before passing. The moment a defender commits, there is a free player somewhere. That read is the whole game.", "question": "How did you draw the defender in before passing? What would have happened if you passed straight away?", "pairs_with": ["flying-numbers", "shrinking-field"], "equipment": "1 ball · 4 cones for square · Pinnies for defenders"}, {"id": "approach-delay", "order": 13, "name": "Approach & Delay", "block": "B3", "skills": ["Pressing", "Delaying", "Challenging"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid about 10 by 15 yards. An attacker with the ball starts at one end line, a defender starts 5 yards away. The attacker scores by dribbling over the far end line. The defender wins by taking the ball or knocking it out. Rotate after every turn. Teach one picture: run at the ball quickly, then slow down as you arrive, with the body turned a little to the side.", "look_for": "Fast approach, slow arrival. A defender who lunges and gets dribbled past has learned something too. Name the player who slows down and stays on their feet, even if the attacker gets by. Delaying is a win at this age. Progress: add a second defender who starts behind the first and calls “cover.”", "question": "When you got close to the dribbler, what did you do with your feet and your speed?", "pairs_with": ["flying-numbers", "shrinking-field"], "equipment": "1 ball per group · Disc cones for the grid · Pinnies"}, {"id": "pressure-cover-3v3", "order": 14, "name": "Pressure & Cover 3v3", "block": "B3", "skills": ["Cover", "Recover", "Working Together"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Grid about 25 by 20 yards with three cone gates on one end line. Attackers (3) score by passing or dribbling through any gate. Defenders (3) win the ball and play it out across the opposite end line. Before each round, defenders name who is first (presses), who is second (covers), and who is third. Freeze the game once or twice per round and ask each defender where they are standing.", "look_for": "The second defender stands behind and to the side of the first, close enough to step in if they are beaten. Look for the defender who steps in after a teammate is dribbled past instead of watching. Look for players who talk: “I have cover.” Do not fix everything at once. Pick one picture per round.", "question": "When your teammate pressed, where did you stand? What did you do when they got beaten?", "pairs_with": ["approach-delay", "flying-numbers"], "equipment": "1 ball · 3 gates (6 tall cones) · Disc cones for the grid · Pinnies"}, {"id": "shadow-marking", "order": 15, "name": "Shadow Marking", "block": "B3", "skills": ["Marking", "Goal Side", "Interceptions"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 8, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Grid about 30 by 20 yards with a small goal at each end, no goalkeepers. 4v4. Give each defender one attacker to stay with (match pinnie colors or numbers). A goal counts double if the scoring player was marked closely, and an interception counts as a point. Everyone plays defender and attacker. Play two minutes per round, then swap who marks whom.", "look_for": "Marking means staying between your player and the goal, close enough to step in when the ball is played. Look for defenders who keep one eye on the ball and one on their player. A defender who ball-watches loses their player. Celebrate the player who steps in front and steals the pass.", "question": "When your player moved, how did you decide how close to stay?", "pairs_with": ["pressure-cover-3v3", "flying-numbers"], "equipment": "1 ball · 2 small goals · Disc cones · Pinnies in 2 colors, numbered if possible"}, {"id": "squeeze-the-space", "order": 16, "name": "Squeeze the Space", "block": "B3", "skills": ["Compact Shape", "Narrow in the Middle", "Deny the Finish"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 9, "max": 18}, "space": "half", "minutes": 15, "setup": "Half field with a goal and a goalkeeper (or a large cone goal). Mark two wide channels, about 5 yards wide, along the sidelines. 5 attackers v 4 defenders. Attackers score from the middle or by crossing from a wide channel. Defenders start by getting narrow and close to the center, then shift toward the ball. Call “squeeze” and the defenders tighten up around the ball.", "look_for": "Defenders closer together than they were a minute ago. A shape that shifts as the ball moves instead of chasing it. Watch for the wide defender who keeps the cross from being easy, and the players who block the shot instead of turning away. Winning the ball is a bonus. Making the shot hard is the goal.", "question": "When the ball went wide, where did the rest of your team go?", "pairs_with": ["approach-delay", "shadow-marking"], "equipment": "1 ball · 1 goal and keeper · Disc cones for channels · Pinnies"}], "blocks": {"B1": {"name": "Me & the Ball", "group_label": "Individual skill, pressure, scanning, body shape", "css": ""}, "B2": {"name": "Me & My Teammates", "group_label": "Passing, combination play, creating and using space", "css": ""}, "B3": {"name": "Me & My Team Defending", "group_label": "Pressing, delaying, covering, marking, staying compact", "css": "defending"}, "B4": {"name": "Me & the Game", "group_label": "Both transitions: the moment we lose it and the moment we win it", "css": ""}, "B5": {"name": "Me & the Moment", "group_label": "Finishing, composure, game management", "css": ""}}, "vocab": {"controlling": {"label": "Controlling", "kind": "tech"}, "protecting": {"label": "Protecting", "kind": "tech"}, "driving": {"label": "Driving", "kind": "tech"}, "dribbling": {"label": "Dribbling", "kind": "tech"}, "passing": {"label": "Passing", "kind": "tech"}, "shooting": {"label": "Shooting", "kind": "tech"}, "scanning": {"label": "Scanning", "kind": "perc"}, "supporting": {"label": "Supporting", "kind": "perc"}, "body-shape": {"label": "Body Shape", "kind": "perc"}, "covering": {"label": "Covering", "kind": "perc"}, "marking": {"label": "Marking", "kind": "perc"}}, "ladder": {"rec": {"u6": [], "u8": ["B1", "B2"], "u10": ["B1", "B2", "B3"], "u12": ["B1", "B2", "B3", "B4"], "u14": ["B1", "B2", "B3", "B4", "B5"]}, "comp": {"u10": ["B1", "B2", "B3"], "u12": ["B1", "B2", "B3", "B4", "B5"], "u14": ["B1", "B2", "B3", "B4", "B5"]}, "levels": {"rec": ["intro"], "comp": ["intro", "dev", "app"]}}};
const $ = s => document.querySelector(s), SP = {quarter:'1/4 field: heavy constraints, runs anywhere', half:'1/2 field: normal spacing', full:'Full field: needs the whole field'};
const ages = [...new Set(['rec','comp'].flatMap(t => Object.keys(D.ladder[t])))], levels = ['intro','dev','app'], LV = {intro:'Introduction', dev:'Development', app:'Application'};
const chk = (id, items, name) => { $(id).innerHTML = items.map(([v,l]) => `<label><input type="checkbox" name="${name}" value="${v}">${l}</label>`).join(''); };
chk('#ages', ages.map(a => [a, a.toUpperCase()]), 'age'); chk('#tracks', [['rec','Rec'],['comp','Comp']], 'track'); chk('#levels', levels.map(l => [l, LV[l]]), 'level');
const tags = () => [...new Set(D.activities.flatMap(a => a.skills).concat(batch.flatMap(a => a.skills)))].sort((x,y) => x.localeCompare(y));
function drawSkills(keep){ chk('#skills', tags().map(t => [t, t]), 'skill'); setv('skill', keep); }
chk('#pairs', D.activities.map(a => [a.id, a.name]), 'pair');
$('#block').innerHTML = Object.keys(D.blocks).map(b => `<option value="${b}">${b} · ${D.blocks[b].name}</option>`).join('');
$('#space').innerHTML = Object.keys(SP).map(k => `<option value="${k}">${SP[k]}</option>`).join('');
$('#load').innerHTML = '<option value="">New activity</option>' + D.activities.map(a => `<option value="${a.id}">${a.name} (${a.block}, ${a.ages.join(' ')})</option>`).join('');
let editing = null, diagram = null, batch = [];
try { batch = JSON.parse(localStorage.getItem('authorbatch.v1') || '[]'); } catch(e) {}
const vals = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(x => x.value);
const setv = (n, arr) => document.querySelectorAll(`input[name=${n}]`).forEach(x => x.checked = (arr||[]).includes(x.value));

function saveBatch(){ try { localStorage.setItem('authorbatch.v1', JSON.stringify(batch)); } catch(e) {} }
function fit(){
  const b = $('#block').value, issues = [];
  vals('age').forEach(a => vals('track').forEach(t => { const ok = D.ladder[t][a]; if(ok === undefined) issues.push(`${t} has no ${a.toUpperCase()}`); else if(!ok.includes(b)) issues.push(`${t} ${a.toUpperCase()} does not work on ${b}`); }));
  vals('level').forEach(l => vals('track').forEach(t => { if(!D.ladder.levels[t].includes(l)) issues.push(`${t} does not use the ${LV[l]} level`); }));
  $('#fit').innerHTML = issues.length ? `<div class="warn">${[...new Set(issues)].join('<br>')}</div>` : '';
}
document.addEventListener('change', fit);
$('#file').onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { diagram = {name: f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'), data: r.result}; $('#pv').innerHTML = `<img class="pv" src="${r.result}">`; }; r.readAsDataURL(f); };
function fill(a){
  editing = a ? a.id : null; diagram = null; $('#file').value = '';
  $('#name').value = a ? a.name : ''; $('#block').value = a ? a.block : 'B1';
  setv('age', a && a.ages); setv('track', a && a.tracks); setv('level', a && a.levels); drawSkills(a && a.skills); $('#newskills').value = ''; setv('pair', a && a.pairs_with);
  $('#pmin').value = a ? a.players.min : ''; $('#pmax').value = a ? a.players.max : ''; $('#min').value = a ? a.minutes : 15; $('#space').value = a ? a.space : 'quarter';
  ['setup','look_for','question','equipment'].forEach(k => $('#'+k).value = a ? a[k] : '');
  $('#pv').innerHTML = a && a.diagram_src ? `<img class="pv" src="${a.diagram_src}"><small>Current diagram. Choose a file to replace it.</small>` : '';
  $('#msg').innerHTML = ''; fit();
}
$('#load').onchange = e => fill(D.activities.find(a => a.id === e.target.value));
$('#clear').onclick = () => { $('#load').value = ''; fill(null); };
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
$('#add').onclick = () => {
  const a = {name: $('#name').value.trim(), block: $('#block').value, ages: vals('age'), tracks: vals('track'), levels: vals('level'), skills: vals('skill').concat($('#newskills').value.split(',').map(x => x.trim()).filter(Boolean)),
    players_min: +$('#pmin').value, players_max: +$('#pmax').value, minutes: +$('#min').value || 15, space: $('#space').value,
    setup: $('#setup').value.trim(), look_for: $('#look_for').value.trim(), question: $('#question').value.trim(), equipment: $('#equipment').value.trim(), pairs_with: vals('pair')};
  const miss = []; [['name','Name'],['ages','Ages'],['tracks','Tracks'],['levels','Levels'],['skills','Skills'],['setup','Setup'],['look_for','What to look for'],['question','Question'],['equipment','Equipment']].forEach(([k,l]) => { if(!a[k] || !a[k].length) miss.push(l); });
  if(!(a.players_min >= 2) || !(a.players_max >= a.players_min)) miss.push('Players (min and max)');
  if(miss.length){ $('#msg').innerHTML = `<div class="err">Still needed: ${miss.join(', ')}</div>`; return; }
  a.id = editing || slug(a.name); a.update = !!editing;
  if(!editing && D.activities.some(x => x.id === a.id)){ $('#msg').innerHTML = `<div class="err">An activity with this name already exists. Load it above to edit it, or change the name.</div>`; return; }
  if(diagram){ a.diagram = diagram.name; a.diagram_data = diagram.data; } else { const old = D.activities.find(x => x.id === editing); if(old && old.diagram) a.diagram = old.diagram; }
  batch = batch.filter(x => x.id !== a.id).concat(a); saveBatch(); drawBatch(); $('#load').value = ''; fill(null); window.scrollTo(0, document.body.scrollHeight);
};
function drawBatch(){
  $('#batch').innerHTML = batch.length ? batch.map((a,i) => `<div class="q"><span><b>${a.name}</b><br><small>${a.block} · ${a.ages.join(', ')} · ${a.tracks.join(', ')} · ${a.update ? 'edit' : 'new'}${a.diagram_data ? ' · diagram' : ''}</small></span><button class="sec sm" data-i="${i}">Remove</button></div>`).join('') : '<small>Nothing added yet.</small>';
  document.querySelectorAll('#batch button').forEach(b => b.onclick = () => { batch.splice(+b.dataset.i, 1); saveBatch(); drawBatch(); });
}
const bundle = () => JSON.stringify({kind: 'activity-batch', activities: batch}, null, 1);
$('#dl').onclick = () => { if(!batch.length) return; const u = URL.createObjectURL(new Blob([bundle()], {type:'application/json'})); const l = document.createElement('a'); l.href = u; l.download = 'activity-batch.json'; document.body.appendChild(l); l.click(); l.remove(); };
$('#cp').onclick = async () => { try { await navigator.clipboard.writeText(bundle()); $('#cp').textContent = 'Copied'; } catch(e) { $('#cp').textContent = 'Copy failed, use Download'; } };
drawBatch(); fill(null);
</script></body></html>
