<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sierra Gold SC Coach Planner</title>
<style>
:root{--navy:#01428A;--navy-dark:#103E77;--gold:#C89D3F;--ink:#222;--mute:#6b7280;--line:#e3e7ee;--bg:#f6f7fa}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy-dark);color:#fff;padding:12px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header img{height:34px}header b{font-size:15px}header small{display:block;opacity:.7;font-size:12px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:17px;margin:20px 0 8px}p.lead{color:var(--mute);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:12px 0 4px}select,input[type=number]{width:100%;padding:10px;font-size:16px;border:1px solid #c9d0db;border-radius:8px;background:#fff}
button,.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:14px;text-align:center;text-decoration:none;display:block}
button.ghost,.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.small{width:auto;padding:7px 12px;font-size:14px;margin:0}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.goal:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:#e8eef8;border-radius:999px;padding:2px 8px;margin-right:4px}
.wk{display:block;color:inherit;text-decoration:none}.wk b{color:var(--navy)}.wk .f{font-size:14px;color:var(--mute)}
.slot{border-top:1px solid var(--line);padding:12px 0}.slot:first-child{border-top:0}.slot .lab{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.slot .nm{font-size:18px;font-weight:700;color:var(--navy)}.slot .note{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;color:var(--navy);font-weight:600;margin-top:8px}
.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.alt span{font-size:15px}
.dg{width:100%;height:auto;border-radius:8px;margin-top:10px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;margin-top:10px}
.back{display:inline-block;margin:4px 0 8px;color:var(--navy);text-decoration:none;font-weight:600}
nav.tabs{display:flex;gap:6px;margin:6px 0 12px}nav.tabs a{flex:1;text-align:center;padding:8px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--navy);text-decoration:none;font-size:14px;font-weight:600}nav.tabs a.on{background:var(--navy);color:#fff}
.reset{color:var(--mute);font-size:13px;text-align:center;margin:24px 0}
</style></head><body>

<script>
const DATA = {"activities": [{"id": "flying-numbers", "order": 1, "name": "Flying Numbers", "block": "B1", "skills": ["Decision-Making"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "half", "minutes": 15, "setup": "Mark space with cones, small goals on both sides. Two teams along the touchline either side of you. Call a number combo (1v1, 2v1, 2v2, 3v2) and each side sends in that number to scrimmage. New players rotate in after every goal or ball out. Call different numbers from each side to create imbalanced situations.", "look_for": "The most adaptable game in the toolkit. If one player is dominating, play them 1v2. If a quieter player needs more touches, play the ball directly to them. You control the challenge level in real time. Works perfectly as an anchor activity because it never feels the same twice.", "question": "When you had more players than the other team, what did you do with that extra person?", "pairs_with": ["shrinking-field", "rondo", "1v1-to-endlines-goals"], "equipment": "1 ball · 2 goals · Disc cones · Pinnies"}, {"id": "shrinking-field", "order": 2, "name": "Shrinking Field", "block": "B1", "skills": ["Controlling", "Body Shape"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with goals at each end. 3v3 or 4v4. Every minute, move each touchline in by 3 steps. The field narrows progressively. Players must make decisions faster as space disappears. Team with most goals after 3 minutes wins the round. Play 2–3 rounds.", "look_for": "Players whose first touch opens their body, hips at 45 to 90 degrees toward goal, have more time in tight spaces. Players who receive square-on get pressed immediately. On the second visit, frame it as a defending focus: which team stays compact and presses together as the field shrinks?", "question": "As the field got smaller, what changed about when you decided to pass?", "pairs_with": ["flying-numbers", "rondo"], "equipment": "1 ball · 2 goals · Disc cones"}, {"id": "1v1-to-endlines-goals", "order": 3, "name": "1v1 to Endlines & Goals", "block": "B1", "skills": ["Dribbling", "Pressing", "Controlling"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 14}, "space": "quarter", "minutes": 15, "setup": "1v1 to Endlines: small rectangle, score by dribbling ball over opponent’s end line within arm’s distance. Progress to 1v1 to Small Goals: add cone goals at each end, score below knee height. Pairs run simultaneously. Fast rotations. Keep multiple pairs active at once.", "look_for": "At U10 the focus shifts: not just beating the defender, but the decision: dribble or shoot? When is each the right answer? Players who look up to check for the goal before driving are already thinking ahead. Works well as an anchor because every player is active simultaneously.", "question": "When you got past your opponent, what made you decide to shoot rather than keep dribbling?", "pairs_with": ["gates-passing", "2v2-to-endlines-attacking"], "equipment": "1 ball per pair · 4 cones per game · Pinnies · Small goals optional"}, {"id": "rondo", "order": 4, "name": "Rondo", "block": "B1", "skills": ["Possession", "Body Shape", "Passing"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 5, "max": 15}, "space": "quarter", "minutes": 15, "setup": "Square grid, one defender in the center, four attackers on the outside. This is called a rondo. Attackers keep the ball away from the defender. When the defender wins it or the ball goes out, the attacker who last touched it swaps into the middle. Keep track of consecutive passes. Progress: add a second defender (4v2) if passing is excellent, or drop to 3v1 to force attackers to move more.", "look_for": "Look for attackers spreading out to give the player with the ball multiple options. Players who bunch together make the defender's job easy. The player with the ball should always have at least two teammates they can see. On the receiving end, open hips give a player more time before the defender closes in.", "question": "When you were in the middle defending, what made it harder to win the ball? What made it easier?", "pairs_with": ["flying-numbers", "gates-passing"], "equipment": "1 ball per group · 4 cones per square · Pinnies for defenders", "aliases": ["4v2 Keep-Away"]}, {"id": "gates-passing", "order": 5, "name": "Gates Passing", "block": "B2", "skills": ["Passing", "Supporting", "Communication"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 16}, "space": "half", "minutes": 15, "setup": "Rectangular grid with 8–10 gates scattered throughout (two cones arm’s length apart). Players in pairs with one ball. Score by passing to each other through gates. After passing, move immediately to a new gate. Encourage players to tell their partner where they are going before they pass.", "look_for": "The pass-and-move habit is the entire point. A player who passes and stands still is not learning “Me & My Teammates.” Look for any player who moves after passing. Name it when you see it. Also look for open body shape on receiving. Progress: replace the gates with cone triangles scattered around the grid. Players score by passing through a triangle to their partner. Now add a challenge: tell your partner where you are going before you pass. The pair that communicates most will score the most.", "question": "After you passed the ball, what did you do next? Why does moving matter?", "pairs_with": ["flying-numbers", "rondo"], "equipment": "1 ball per pair · 8–10 tall cone gates · Disc cones for grid", "variants": [{"id": "triangle-goal-game", "name": "Triangle Goal Game", "note": "Progression: replace the gates with cone triangles. Players score by passing through a triangle to their partner."}]}, {"id": "end-zone-passing", "order": 6, "name": "End Zone Passing", "block": "B2", "skills": ["Supporting", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with a small end zone marked at each end (about 4 yards deep). Two teams of 3 or 4. Players can dribble freely in the middle of the field, but the only way to score is to pass the ball to a teammate who has run into the opponent's end zone to receive it. The receiver must have both feet inside the end zone when they catch the ball.", "look_for": "This game makes movement off the ball essential. A team that stands still cannot score because no one is in the end zone to receive. Look for players who time their run to arrive as the ball is being played. Any player who calls for the ball while running into the end zone is showing real game intelligence. Celebrate those moments explicitly.", "question": "When did you run into the end zone? What were you watching to know when to go?", "pairs_with": ["gates-passing", "flying-numbers"], "equipment": "1 ball · Disc cones for grid and end zones · Pinnies"}, {"id": "numbers-passing", "order": 7, "name": "Numbers Passing", "block": "B2", "skills": ["Passing", "Body Shape", "Scanning"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 8}, "space": "quarter", "minutes": 15, "setup": "Grid with 4 cones. Assign each player a number, their passing order. Players jog around the space passing in numbered order: 1 to 2, 2 to 3, until the last number passes back to 1. Add a second ball when they find a rhythm. Optional: add a goal. The last player shoots, then becomes the new number 1.", "look_for": "Look for players keeping hips open (not square-on), cushioning the ball softly, then taking a purposeful next touch. Players who are always looking for the next number before the ball arrives will stand out. That anticipation is body shape doing its job. Works well as a focus activity after Gates Passing.", "question": "How did you know where the next number was before the ball came to you?", "pairs_with": ["1v1-to-endlines-goals", "flying-numbers"], "equipment": "1 ball (2 when ready) · Disc cones for grid"}, {"id": "2v2-to-endlines-attacking", "order": 8, "name": "2v2 to Endlines — Attacking", "block": "B2", "skills": ["Supporting", "Numerical Advantage"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Small rectangular space. Two attackers vs two defenders. Attackers score by dribbling ball over opponent’s end line within arm’s distance. Defenders can steal and score too. Rotate new players when scoring or ball out. Keep it fast. Run multiple games simultaneously.", "look_for": "Encourage the attacker with the ball to drive at one defender to commit them, while the second attacker finds open space. When they spread out and use that advantage, celebrate it. The moment a player passes around a committed defender, even once, is worth highlighting for the whole group.", "question": "When you had the ball and a defender coming at you, what options did you have?", "pairs_with": ["1v1-to-endlines-goals", "flying-numbers"], "equipment": "1 ball per game · 4 cones per game · Pinnies"}, {"id": "3v2-to-goal", "order": 9, "name": "3v2 to Goal", "block": "B2", "skills": ["Numerical Advantage", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 5, "max": 15}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid, small goal at one end. Three attackers from one end meet two defenders. Attackers work together to score. Defenders can score by dribbling over the end line. Remind attackers to spread out. Rotate defenders so they don’t get discouraged.", "look_for": "Do not explain the combination in advance. Run the game and watch it emerge. If a player dribbles at a defender to force commitment and then passes around them, freeze the moment briefly: “Did everyone see that? What happened there?” That is the whole concept in one moment.", "question": "When did you decide to pass rather than keep dribbling? What did you see that told you to pass?", "pairs_with": ["2v2-to-endlines-attacking", "flying-numbers"], "equipment": "1 ball · 1 small goal · Disc cones · Pinnies"}, {"id": "five-goal-game", "order": 10, "name": "Five Goal Game", "block": "B2", "skills": ["Decision-Making"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with a cone goal in each corner plus one in the center, 5 goals total. 3v3 or 4v4. Players try to pass the ball through any goal to a teammate to score in any direction. Defenders protect all 5 goals and can only gain possession by intercepting or stealing.", "look_for": "Attackers must adapt quickly when their path is blocked. Players without the ball must move to open space near goals so their teammate has someone to find. Best as a focus activity later in the season when combination play is starting to click.", "question": "When the goal you were aiming for was blocked, what did you do?", "pairs_with": ["flying-numbers", "3v2-to-goal"], "equipment": "1 ball · 5 goal pairs (4 corners + 1 center) · Pinnies"}, {"id": "barcelona", "order": 11, "name": "Barcelona", "block": "B2", "skills": ["Possession", "Passing", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with goals at each end. 3v3 or 4v4, no goalkeeper. Score points equal to the number of passes completed before scoring: 8 passes before a goal = 8 points. A missed shot scores nothing. Play short rounds of 3–4 minutes.", "look_for": "Teams that learn to move the ball patiently before shooting will outscore teams that rush. Watch for players who switch the ball to the far side before going to goal. That is combination play at its most sophisticated. Best as a focus activity late in the season when passing habits are forming.", "question": "Before you scored, was there a moment where you switched the ball to the other side? What did that open up?", "pairs_with": ["rondo-5v2", "five-goal-game"], "equipment": "1 ball · 2 small goals · Disc cones · Pinnies"}, {"id": "rondo-5v2", "order": 12, "name": "Rondo 5v2", "block": "B2", "skills": ["Passing", "Body Shape", "Controlling"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 7, "max": 14}, "space": "quarter", "minutes": 15, "setup": "Square of cones. Five attackers in a circle, two defenders in the center. Attackers keep the ball away. Track consecutive passes. Attacker who last touched an interception or ball out of bounds swaps with a defender. Rotate defenders every few minutes. Limit to 1–2 touches for extra challenge.", "look_for": "Where the Rondo (4v1) is a small tight game, this is the bigger version: more players, two defenders, faster decisions required. Quick touches and spreading the space are the two things to reinforce. Encourage attackers to draw a defender toward them before passing. The moment a defender commits, there is a free player somewhere. That read is the whole game.", "question": "How did you draw the defender in before passing? What would have happened if you passed straight away?", "pairs_with": ["flying-numbers", "shrinking-field"], "equipment": "1 ball · 4 cones for square · Pinnies for defenders"}, {"id": "approach-delay", "order": 13, "name": "Approach & Delay", "block": "B3", "skills": ["Pressing", "Delaying"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid about 10 by 15 yards. An attacker with the ball starts at one end line, a defender starts 5 yards away. The attacker scores by dribbling over the far end line. The defender wins by taking the ball const KEY = 'coachplanner.v1';
const SPACE = {quarter: 1, half: 2, full: 3};
const SPACE_LABEL = {quarter: '1/4 field', half: '1/2 field', full: 'Full field'};
let state = load();
if(state.space && !SPACE[state.space]) state.space = 'half';
let route = '';
try { route = location.hash.slice(1); } catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = s => document.querySelector(s), app = $('#app');
const acts = Object.fromEntries(DATA.activities.map(a => [a.id, a]));
const plan = DATA.plans[0];
function actName(ref){ const [b, v] = ref.split('#'); const a = acts[b]; if(!v) return a.name; return (a.variants||[]).find(x => x.id === v).name; }
function slotRef(w, si, slot){ const k = `${w.week}-${si}-${slot}`; return (state.swaps||{})[k] || w.sessions[si][slot].activity; }
function fits(a){ return (!state.players || (a.players.min <= state.players && state.players <= a.players.max)) && (!state.space || SPACE[a.space] <= SPACE[state.space]); }
function alternatives(w, si, slot){
  const cur = slotRef(w, si, slot).split('#')[0], other = slotRef(w, si, slot === 'a' ? 'b' : 'a').split('#')[0];
  const ok = DATA.ladder.rec.u10;
  return DATA.activities.filter(a => a.id !== cur && a.id !== other && fits(a) && (slot === 'b' ? a.block === w.block : ok.indexOf(a.block) <= ok.indexOf(w.block)));
}
function go(h){ route = h; try { history.replaceState(null, '', '#' + h); } catch(e){} render(); }
document.addEventListener('click', e => { const a = e.target.closest('[data-nav]'); if(a){ e.preventDefault(); go(a.dataset.nav); } });
function tabs(on){ return `<nav class="tabs">${[['plan','Season'],['players','Players'],['goals','Goals'],['setup','Setup']].map(([h,l]) => `<a href="#" data-nav="${h}" class="${on===h?'on':''}">${l}</a>`).join('')}</nav>`; }
function viewSetup(){
  app.innerHTML = `<h1>Set up your team</h1><p class="lead">U10 recreational. Two minutes, and you can change it any time.</p>
  <div class="card"><label>Players at a typical practice</label><input id="pl" type="number" min="4" max="24" value="${state.players||12}">
  <label>Space you usually have for a session</label><select id="sp">${Object.keys(SPACE_LABEL).map(k => `<option value="${k}" ${(state.space||'half')===k?'selected':''}>${SPACE_LABEL[k]}</option>`).join('')}</select>
  <button id="ok">${state.players ? 'Save' : 'Next: your players'}</button></div>
  <p class="reset"><a href="#" id="rs">Start over</a></p>`;
  $('#ok').onclick = () => { const first = !state.players; state.players = +$('#pl').value; state.space = $('#sp').value; save(); go(first ? 'players' : 'plan'); };
  $('#rs').onclick = e => { e.preventDefault(); state = {}; save(); go('setup'); };
}
function viewPlayers(){
  const P = DATA.players;
  app.innerHTML = tabs('players') + `<h1>Who is in front of you</h1><p class="lead">Understanding your U10 players.</p>
  <div class="card">${P.who.map(x => `<p><b>${x.label}</b><br>${x.text}</p>`).join('')}</div>
  <h2>What a great session looks like</h2>
  <div class="card">${P.great_session.map(x => `<p><b>${x.title}</b><br>${x.text}</p>`).join('')}</div>
  <h2>Before you arrive</h2><div class="card"><p>${P.prepared}</p></div>
  <h2>The parents on the sideline</h2><div class="card"><p>${P.parents.intro}</p><p><i>&ldquo;${P.parents.script}&rdquo;</i></p><p>${P.parents.outro}</p></div>
  <button data-nav="goals">Next: player goals</button>`;
}
function viewGoals(){
  const goals = DATA.goals;
  app.innerHTML = tabs('goals') + `<h1>Player goals</h1><p class="lead">By the end of the season, a U10 should be showing these. The plan on the next screen builds toward them.</p>
  <div class="card">${goals.map(g => `<div class="goal"><span>${g.text}<br>${g.blocks.map(b => `<span class="tag">${DATA.blocks[b].name}</span>`).join('')}</span></div>`).join('')}</div>
  <button data-nav="plan">Next: your season</button>`;
}
function viewPlan(){
  app.innerHTML = tabs('plan') + `<h1>Your season</h1><p class="lead">8 weeks, two practices a week. Tap a week to see the sessions.</p>` + plan.weeks.map(w => `<a class="card wk" href="#" data-nav="week/${w.week}"><b>Week ${w.week}</b><div class="f">${w.focus}</div></a>`).join('');
}
function viewWeek(n){
  const w = plan.weeks.find(x => x.week === n);
  if(w.coach_choice){ app.innerHTML = `<a class="back" href="#" data-nav="plan">&larr; Season</a><h1>Week ${w.week}</h1><div class="card"><b>${w.focus}</b><p>${w.note}</p></div>`; return; }
  const sessions = [0,1].map(si => `<div class="card"><b>Practice ${si ? 'B' : 'A'}</b>` + ['a','b'].map(slot => {
    const ref = slotRef(w, si, slot), a = acts[ref.split('#')[0]], note = (w.sessions[si][slot].note);
    const swapped = (state.swaps||{})[`${w.week}-${si}-${slot}`];
    const alts = alternatives(w, si, slot);
    return `<div class="slot"><div class="lab">Activity ${slot.toUpperCase()}${slot==='a'?' · anchor':' · focus'}</div><div class="nm">${actName(ref)}</div>
      <div class="note">${swapped ? 'Swapped in' : note}</div>
      <details><summary>How to run it</summary>${a.diagram_src ? `<img class="dg" src="${a.diagram_src}" alt="${a.name} diagram">` : ''}<div class="lbl">Setup</div>${a.setup}<div class="lbl">What to look for</div>${a.look_for}<div class="lbl">Ask</div>&ldquo;${a.question}&rdquo;<div class="lbl">Equipment</div>${a.equipment}</details>
      <details><summary>Swap (${alts.length} fit your numbers and space)</summary>${alts.map(x => `<div class="alt"><span>${x.name}</span><button class="small" data-k="${w.week}-${si}-${slot}" data-id="${x.id}">Use</button></div>`).join('') || '<p class="note">Nothing else fits. Try a different space in Setup.</p>'}
      ${swapped ? `<button class="small ghost" data-k="${w.week}-${si}-${slot}" data-id="">Put the original back</button>` : ''}</details></div>`;
  }).join('') + '</div>').join('');
  app.innerHTML = `<a class="back" href="#" data-nav="plan">&larr; Season</a><h1>Week ${w.week}</h1><p class="lead">${w.focus}</p>` + sessions;
  app.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { state.swaps = state.swaps || {}; if(b.dataset.id) state.swaps[b.dataset.k] = b.dataset.id; else delete state.swaps[b.dataset.k]; save(); viewWeek(n); });
}
function render(){
  const h = route || (state.players ? 'plan' : 'setup');
  if(!state.players && h !== 'setup'){ route = 'setup'; return render(); }
  if(h === 'setup') viewSetup(); else if(h === 'players') viewPlayers(); else if(h === 'goals') viewGoals(); else if(h.startsWith('week/')) viewWeek(+h.split('/')[1]); else viewPlan();
  window.scrollTo(0,0);
}
render();
</script></body></html>
