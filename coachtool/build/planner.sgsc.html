<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sierra Gold SC Coach Planner</title>
<style>
:root{--navy:#01428A;--navy-dark:#103E77;--gold:#C89D3F;--ink:#222;--mute:#6b7280;--line:#e3e7ee;--bg:#f6f7fa}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy-dark);color:#fff;padding:12px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header img{height:34px}header b{font-size:15px}header small{display:block;opacity:.7;font-size:12px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:17px;margin:20px 0 8px}p.lead{color:var(--mute);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:12px 0 4px}select,input[type=number]{width:100%;padding:10px;font-size:16px;border:1px solid #c9d0db;border-radius:8px;background:#fff}
button,.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:14px;text-align:center;text-decoration:none;display:block}
button.ghost,.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.small{width:auto;padding:7px 12px;font-size:14px;margin:0}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.goal:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:#e8eef8;border-radius:999px;padding:2px 8px;margin-right:4px}
.wk{display:block;color:inherit;text-decoration:none}.wk b{color:var(--navy)}.wk .f{font-size:14px;color:var(--mute)}
.slot{border-top:1px solid var(--line);padding:12px 0}.slot:first-child{border-top:0}.slot .lab{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.slot .nm{font-size:18px;font-weight:700;color:var(--navy)}.slot .note{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;color:var(--navy);font-weight:600;margin-top:8px}
.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.alt span{font-size:15px}
.dg{width:100%;height:auto;border-radius:8px;margin-top:10px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;margin-top:10px}
.tag{text-decoration:none}
.back{display:inline-block;margin:4px 0 8px;color:var(--navy);text-decoration:none;font-weight:600}
nav.tabs{display:flex;gap:6px;margin:6px 0 12px}nav.tabs a{flex:1;text-align:center;padding:8px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--navy);text-decoration:none;font-size:14px;font-weight:600}nav.tabs a.on{background:var(--navy);color:#fff}
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}.strip a{color:var(--navy);text-decoration:none;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.strip a.off{opacity:.3;pointer-events:none}.strip span{font-size:13px;color:var(--mute);text-align:center}
.dots{display:flex;gap:5px;margin:4px 0 10px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--gold)}
.skip{display:block;text-align:center;color:var(--mute);font-size:14px;margin-top:14px}.banner{background:#fff8e6;border:1px solid #f0dca0;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.rule .src{font-size:12px;color:var(--mute)}.rule .club{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase}
.row{display:block;color:inherit;text-decoration:none}.row b{color:var(--navy)}
@media print{header,nav.tabs,.strip a,.noprint,button,summary{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{break-inside:avoid;border-color:#bbb}details>*{display:block}}
.share{display:flex;gap:8px;margin:14px 0}.share button{margin:0;flex:1}
nav.tabs{gap:0!important;margin:0 0 12px!important;border-bottom:1px solid var(--line)}nav.tabs a{flex:1;background:none!important;border:0!important;border-bottom:3px solid transparent!important;border-radius:0!important;padding:10px 4px!important;font-size:15px!important;color:var(--mute)!important}nav.tabs a.on{color:var(--navy)!important;border-bottom-color:var(--gold)!important}
.card>p:first-child{margin-top:0}.card>p:last-child{margin-bottom:0}.card.game{background:#f0f3f9;border-style:dashed}
.swap summary{font-size:14px;color:var(--mute);font-weight:500}.bar{height:4px;border-radius:2px;background:var(--line);margin:4px 0 8px}.bar i{display:block;height:100%;border-radius:2px;background:var(--gold)}
input[type=date]{width:100%;padding:10px;font:inherit;font-size:16px;border:1px solid #c9d0db;border-radius:8px;background:#fff;min-height:46px}
.reset a{color:var(--mute)}select:invalid{color:var(--mute)}
.reset{color:var(--mute);font-size:13px;text-align:center;margin:24px 0}
</style></head><body>

<script>
const DATA = {"help": {"email": "", "form": "", "support": "Your Age Group Coordinator and the club Technical Director are there for exactly this."}, "activities": [{"id": "flying-numbers", "order": 1, "name": "Flying Numbers", "block": "B1", "skills": ["Decision-Making"], "ages": ["u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "half", "minutes": 15, "setup": "Mark space with cones, small goals on both sides. Two teams along the touchline either side of you. Call a number combo (1v1, 2v1, 2v2, 3v2) and each side sends in that number to scrimmage. New players rotate in after every goal or ball out. Call different numbers from each side to create imbalanced situations.", "look_for": "The most adaptable game in the toolkit. If one player is dominating, play them 1v2. If a quieter player needs more touches, play the ball directly to them. You control the challenge level in real time. Works perfectly as an anchor activity because it never feels the same twice.", "question": "When you had more players than the other team, what did you do with that extra person?", "pairs_with": ["shrinking-field", "rondo", "1v1-to-endlines-goals"], "equipment": "1 ball · 2 goals · Disc cones · Pinnies", "for_age": {"u12": {"setup": "Mark space with cones, goals on both sides. Two teams along the touchline either side of you. Call a number combo and each side sends in that number to scrimmage. New players rotate in after every goal or ball out. Frame the transition explicitly: outgoing players sprint off, incoming players sprint on. No walking at any point.", "look_for": "The most adaptable game in the toolkit and the best anchor activity at U12. Works as pure anchor (high energy, familiar) or as a transition focus when you emphasize the urgency of sprinting in and out. If one player is dominating, play them 1v2.", "question": "When you had more players than the other team, what did you do with that extra person?"}, "u14": {"setup": "Mark a space with cones, goals on both sides. Two teams along the touchline either side of you. Call a number combination and each side sends in that many players to scrimmage. New players rotate in after every goal or ball out. Outgoing players sprint off, incoming players sprint on. No walking at any point.", "look_for": "Your anchor activity every week. Players know it from U12, so it needs almost no explanation and it settles the group fast. At U14, call uneven numbers (3v2, 4v3) and watch what the extra player does. If one player is dominating, play them 1v2.", "question": "When your team had the extra player, what did you do with that advantage?"}}}, {"id": "shrinking-field", "order": 2, "name": "Shrinking Field", "block": "B1", "skills": ["Controlling", "Body Shape"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with goals at each end. 3v3 or 4v4. Every minute, move each touchline in by 3 steps. The field narrows progressively. Players must make decisions faster as space disappears. Team with most goals after 3 minutes wins the round. Play 2–3 rounds.", "look_for": "Players whose first touch opens their body, hips at 45 to 90 degrees toward goal, have more time in tight spaces. Players who receive square-on get pressed immediately. On the second visit, frame it as a defending focus: which team stays compact and presses together as the field shrinks?", "question": "As the field got smaller, what changed about when you decided to pass?", "pairs_with": ["flying-numbers", "rondo"], "equipment": "1 ball · 2 goals · Disc cones"}, {"id": "1v1-to-endlines-goals", "order": 3, "name": "1v1 to Endlines & Goals", "block": "B1", "skills": ["Dribbling", "Pressing", "Controlling"], "ages": ["u8", "u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 14}, "space": "quarter", "minutes": 15, "setup": "1v1 to Endlines: small rectangle, score by dribbling ball over opponent’s end line within arm’s distance. Progress to 1v1 to Small Goals: add cone goals at each end, score below knee height. Pairs run simultaneously. Fast rotations. Keep multiple pairs active at once.", "look_for": "At U10 the focus shifts: not just beating the defender, but the decision: dribble or shoot? When is each the right answer? Players who look up to check for the goal before driving are already thinking ahead. Works well as an anchor because every player is active simultaneously.", "question": "When you got past your opponent, what made you decide to shoot rather than keep dribbling?", "pairs_with": ["gates-passing", "2v2-to-endlines-attacking"], "equipment": "1 ball per pair · 4 cones per game · Pinnies · Small goals optional", "for_age": {"u8": {"setup": "Pairs working in rectangles about 10 by 15 yards. 1v1 to Endlines: players score by dribbling the ball over their opponent's end line with the ball within arm's reach of their body. No shooting, so more touches and more decisions. Progress to 1v1 to Cone Goals: add a cone goal at each end and players score by kicking through below knee height. Run all pairs simultaneously. Fast rotations keep everyone active.", "look_for": "Players trying to dribble past the defender rather than just kicking and chasing. Reward the attempt regardless of outcome. If players are unevenly matched, play the ball directly to the less skilled player to level the challenge.", "question": "When you had the ball, did you try to go past your opponent or around them? What worked?"}}}, {"id": "rondo", "order": 4, "name": "Rondo", "block": "B1", "skills": ["Possession", "Body Shape", "Passing"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 5, "max": 15}, "space": "quarter", "minutes": 15, "setup": "Square grid, one defender in the center, four attackers on the outside. This is called a rondo. Attackers keep the ball away from the defender. When the defender wins it or the ball goes out, the attacker who last touched it swaps into the middle. Keep track of consecutive passes. Progress: add a second defender (4v2) if passing is excellent, or drop to 3v1 to force attackers to move more.", "look_for": "Look for attackers spreading out to give the player with the ball multiple options. Players who bunch together make the defender's job easy. The player with the ball should always have at least two teammates they can see. On the receiving end, open hips give a player more time before the defender closes in.", "question": "When you were in the middle defending, what made it harder to win the ball? What made it easier?", "pairs_with": ["flying-numbers", "gates-passing"], "equipment": "1 ball per group · 4 cones per square · Pinnies for defenders", "aliases": ["4v2 Keep-Away"]}, {"id": "gates-passing", "order": 5, "name": "Gates Passing", "block": "B2", "skills": ["Passing", "Supporting", "Communication"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 16}, "space": "half", "minutes": 15, "setup": "Rectangular grid with 8–10 gates scattered throughout (two cones arm’s length apart). Players in pairs with one ball. Score by passing to each other through gates. After passing, move immediately to a new gate. Encourage players to tell their partner where they are going before they pass.", "look_for": "The pass-and-move habit is the entire point. A player who passes and stands still is not learning “Me & My Teammates.” Look for any player who moves after passing. Name it when you see it. Also look for open body shape on receiving. Progress: replace the gates with cone triangles scattered around the grid. Players score by passing through a triangle to their partner. Now add a challenge: tell your partner where you are going before you pass. The pair that communicates most will score the most.", "question": "After you passed the ball, what did you do next? Why does moving matter?", "pairs_with": ["flying-numbers", "rondo"], "equipment": "1 ball per pair · 8–10 tall cone gates · Disc cones for grid", "variants": [{"id": "triangle-goal-game", "name": "Triangle Goal Game", "note": "Progression: replace the gates with cone triangles. Players score by passing through a triangle to their partner."}]}, {"id": "end-zone-passing", "order": 6, "name": "End Zone Passing", "block": "B2", "skills": ["Supporting", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with a small end zone marked at each end (about 4 yards deep). Two teams of 3 or 4. Players can dribble freely in the middle of the field, but the only way to score is to pass the ball to a teammate who has run into the opponent's end zone to receive it. The receiver must have both feet inside the end zone when they catch the ball.", "look_for": "This game makes movement off the ball essential. A team that stands still cannot score because no one is in the end zone to receive. Look for players who time their run to arrive as the ball is being played. Any player who calls for the ball while running into the end zone is showing real game intelligence. Celebrate those moments explicitly.", "question": "When did you run into the end zone? What were you watching to know when to go?", "pairs_with": ["gates-passing", "flying-numbers"], "equipment": "1 ball · Disc cones for grid and end zones · Pinnies"}, {"id": "numbers-passing", "order": 7, "name": "Numbers Passing", "block": "B2", "skills": ["Passing", "Body Shape", "Scanning"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 8}, "space": "quarter", "minutes": 15, "setup": "Grid with 4 cones. Assign each player a number, their passing order. Players jog around the space passing in numbered order: 1 to 2, 2 to 3, until the last number passes back to 1. Add a second ball when they find a rhythm. Optional: add a goal. The last player shoots, then becomes the new number 1.", "look_for": "Look for players keeping hips open (not square-on), cushioning the ball softly, then taking a purposeful next touch. Players who are always looking for the next number before the ball arrives will stand out. That anticipation is body shape doing its job. Works well as a focus activity after Gates Passing.", "question": "How did you know where the next number was before the ball came to you?", "pairs_with": ["1v1-to-endlines-goals", "flying-numbers"], "equipment": "1 ball (2 when ready) · Disc cones for grid"}, {"id": "2v2-to-endlines-attacking", "order": 8, "name": "2v2 to Endlines — Attacking", "block": "B2", "skills": ["Supporting", "Numerical Advantage"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Small rectangular space. Two attackers vs two defenders. Attackers score by dribbling ball over opponent’s end line within arm’s distance. Defenders can steal and score too. Rotate new players when scoring or ball out. Keep it fast. Run multiple games simultaneously.", "look_for": "Encourage the attacker with the ball to drive at one defender to commit them, while the second attacker finds open space. When they spread out and use that advantage, celebrate it. The moment a player passes around a committed defender, even once, is worth highlighting for the whole group.", "question": "When you had the ball and a defender coming at you, what options did you have?", "pairs_with": ["1v1-to-endlines-goals", "flying-numbers"], "equipment": "1 ball per game · 4 cones per game · Pinnies"}, {"id": "3v2-to-goal", "order": 9, "name": "3v2 to Goal", "block": "B2", "skills": ["Numerical Advantage", "Combination Play"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 5, "max": 15}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid, small goal at one end. Three attackers from one end meet two defenders. Attackers work together to score. Defenders can score by dribbling over the end line. Remind attackers to spread out. Rotate defenders so they don’t get discouraged.", "look_for": "Do not explain the combination in advance. Run the game and watch it emerge. If a player dribbles at a defender to force commitment and then passes around them, freeze the moment briefly: “Did everyone see that? What happened there?” That is the whole concept in one moment.", "question": "When did you decide to pass rather than keep dribbling? What did you see that told you to pass?", "pairs_with": ["2v2-to-endlines-attacking", "flying-numbers"], "equipment": "1 ball · 1 small goal · Disc cones · Pinnies"}, {"id": "five-goal-game", "order": 10, "name": "Five Goal Game", "block": "B2", "skills": ["Decision-Making"], "ages": ["u10", "u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with a cone goal in each corner plus one in the center, 5 goals total. 3v3 or 4v4. Players try to pass the ball through any goal to a teammate to score in any direction. Defenders protect all 5 goals and can only gain possession by intercepting or stealing.", "look_for": "Attackers must adapt quickly when their path is blocked. Players without the ball must move to open space near goals so their teammate has someone to find. Best as a focus activity later in the season when combination play is starting to click.", "question": "When the goal you were aiming for was blocked, what did you do?", "pairs_with": ["flying-numbers", "3v2-to-goal"], "equipment": "1 ball · 5 goal pairs (4 corners + 1 center) · Pinnies", "for_age": {"u12": {"setup": "Rectangular grid with a cone goal in each corner plus one in the center, 5 goals total. 3v3 or 4v4. Players try to pass the ball through any goal to a teammate to score in any direction. Defenders protect all 5 goals and can only gain possession by intercepting or stealing.", "look_for": "At U12 this game requires players to read the whole picture: all five goals, where teammates are, where defenders are. Watch for players who signal to a teammate where they are switching before the ball arrives. That anticipation is team play at its most sophisticated. Also watch for immediate transition reactions on every turnover.", "question": "When you changed which goal you were going for, did your teammate know before you passed, or after?"}}}, {"id": "barcelona", "order": 11, "name": "Barcelona", "block": "B2", "skills": ["Possession", "Passing", "Combination Play"], "ages": ["u10", "u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with goals at each end. 3v3 or 4v4, no goalkeeper. Score points equal to the number of passes completed before scoring: 8 passes before a goal = 8 points. A missed shot scores nothing. Play short rounds of 3–4 minutes.", "look_for": "Teams that learn to move the ball patiently before shooting will outscore teams that rush. Watch for players who switch the ball to the far side before going to goal. That is combination play at its most sophisticated. Best as a focus activity late in the season when passing habits are forming.", "question": "Before you scored, was there a moment where you switched the ball to the other side? What did that open up?", "pairs_with": ["rondo-5v2", "five-goal-game"], "equipment": "1 ball · 2 small goals · Disc cones · Pinnies", "for_age": {"u12": {"setup": "Rectangular grid with goals at each end. 3v3 or 4v4, no goalkeeper. Score points equal to the number of passes completed before scoring: 8 passes before a goal = 8 points. A missed shot scores nothing. Play short rounds of 3 to 4 minutes.", "look_for": "Watch for players who switch the ball to the far side before going to goal, drawing defenders before finding the opening. Celebrate it when it happens by name. Best as a focus activity, not an anchor.", "question": "Before you scored, was there a moment where you switched the ball to the other side? What did that open up?"}, "u14": {"setup": "Rectangular grid with goals at each end. 4v4, no goalkeeper. Score points equal to the number of passes completed before scoring: 8 passes before a goal is 8 points. A missed shot scores nothing. Play short rounds of 3 to 4 minutes.", "look_for": "Watch for players who switch the ball to the far side before going to goal, drawing defenders across before finding the opening. Name it when it happens. Best as a focus activity, not an anchor.", "question": "Before you scored, was there a moment you switched the ball to the other side? What did that open up?"}}}, {"id": "rondo-5v2", "order": 12, "name": "Rondo 5v2", "block": "B2", "skills": ["Passing", "Body Shape", "Controlling"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 7, "max": 14}, "space": "quarter", "minutes": 15, "setup": "Square of cones. Five attackers in a circle, two defenders in the center. Attackers keep the ball away. Track consecutive passes. Attacker who last touched an interception or ball out of bounds swaps with a defender. Rotate defenders every few minutes. Limit to 1–2 touches for extra challenge.", "look_for": "Where the Rondo (4v1) is a small tight game, this is the bigger version: more players, two defenders, faster decisions required. Quick touches and spreading the space are the two things to reinforce. Encourage attackers to draw a defender toward them before passing. The moment a defender commits, there is a free player somewhere. That read is the whole game.", "question": "How did you draw the defender in before passing? What would have happened if you passed straight away?", "pairs_with": ["flying-numbers", "shrinking-field"], "equipment": "1 ball · 4 cones for square · Pinnies for defenders"}, {"id": "approach-delay", "order": 13, "name": "Approach & Delay", "block": "B3", "skills": ["Pressing", "Delaying"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid about 10 by 15 yards. An attacker with the ball starts at one end line, a defender starts 5 yards away. The attacker scores by dribbling over the far end line. The defender wins by taking the ball or knocking it out. Rotate after every turn. Teach one picture: run at the ball quickly, then slow down as you arrive, with the body turned a little to the side.", "look_for": "Fast approach, slow arrival. A defender who lunges and gets dribbled past has learned something too. Name the player who slows down and stays on their feet, even if the attacker gets by. Delaying is a win at this age. Progress: add a second defender who starts behind the first and calls “cover.”", "question": "When you got close to the dribbler, what did you do with your feet and your speed?", "pairs_with": ["flying-numbers", "shrinking-field"], "equipment": "1 ball per group · Disc cones for the grid · Pinnies"}, {"id": "pressure-cover-3v3", "order": 14, "name": "Pressure & Cover 3v3", "block": "B3", "skills": ["Covering", "Communication"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 12}, "space": "quarter", "minutes": 15, "setup": "Grid about 25 by 20 yards with three cone gates on one end line. Attackers (3) score by passing or dribbling through any gate. Defenders (3) win the ball and play it out across the opposite end line. Before each round, defenders name who is first (presses), who is second (covers), and who is third. Freeze the game once or twice per round and ask each defender where they are standing.", "look_for": "The second defender stands behind and to the side of the first, close enough to step in if they are beaten. Look for the defender who steps in after a teammate is dribbled past instead of watching. Look for players who talk: “I have cover.” Do not fix everything at once. Pick one picture per round.", "question": "When your teammate pressed, where did you stand? What did you do when they got beaten?", "pairs_with": ["approach-delay", "flying-numbers"], "equipment": "1 ball · 3 gates (6 tall cones) · Disc cones for the grid · Pinnies"}, {"id": "shadow-marking", "order": 15, "name": "Shadow Marking", "block": "B3", "skills": ["Marking"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 8, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Grid about 30 by 20 yards with a small goal at each end, no goalkeepers. 4v4. Give each defender one attacker to stay with (match pinnie colors or numbers). A goal counts double if the scoring player was marked closely, and an interception counts as a point. Everyone plays defender and attacker. Play two minutes per round, then swap who marks whom.", "look_for": "Marking means staying between your player and the goal, close enough to step in when the ball is played. Look for defenders who keep one eye on the ball and one on their player. A defender who ball-watches loses their player. Celebrate the player who steps in front and steals the pass.", "question": "When your player moved, how did you decide how close to stay?", "pairs_with": ["pressure-cover-3v3", "flying-numbers"], "equipment": "1 ball · 2 small goals · Disc cones · Pinnies in 2 colors, numbered if possible"}, {"id": "squeeze-the-space", "order": 16, "name": "Squeeze the Space", "block": "B3", "skills": ["Compact Shape"], "ages": ["u10"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 9, "max": 18}, "space": "half", "minutes": 15, "setup": "Half field with a goal and a goalkeeper (or a large cone goal). Mark two wide channels, about 5 yards wide, along the sidelines. 5 attackers v 4 defenders. Attackers score from the middle or by crossing from a wide channel. Defenders start by getting narrow and close to the center, then shift toward the ball. Call “squeeze” and the defenders tighten up around the ball.", "look_for": "Defenders closer together than they were a minute ago. A shape that shifts as the ball moves instead of chasing it. Watch for the wide defender who keeps the cross from being easy, and the players who block the shot instead of turning away. Winning the ball is a bonus. Making the shot hard is the goal.", "question": "When the ball went wide, where did the rest of your team go?", "pairs_with": ["approach-delay", "shadow-marking"], "equipment": "1 ball · 1 goal and keeper · Disc cones for channels · Pinnies"}, {"id": "red-light-green-light", "order": 17, "name": "Red Light Green Light", "block": "B1", "skills": ["Driving", "Controlling"], "ages": ["u6", "u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 25 by 20 yards. Every player has a ball. Green light: dribble fast. Yellow light: slow down with small touches to keep the ball close. Red light: stop with one foot on the ball. Call lights at random as players move around the grid. After a minute, ask players to suggest a new color and give it a new action (orange means swing your arms, purple means dance) and repeat each new color a few times.", "look_for": "Players keeping the ball within arm's reach at yellow. Heads up to avoid collisions. On red light, emphasize using the sole of the foot to stop rather than letting the ball roll away.", "question": "When I called yellow, what did you have to do with your feet to keep the ball close?", "pairs_with": ["gates-dribbling", "101-dalmatians"], "equipment": "1 ball per player · Disc cones for grid", "for_age": {"u6": {"setup": "Grid about 25 by 20 yards. Every player has a ball. Green light: dribble fast. Yellow light: slow down with small touches. Red light: stop with one foot on the ball. Call lights at random. After a minute, ask players to suggest a new color and assign it a new action: orange means spin around, purple means jump. Add each new color a few times before introducing the next one.", "look_for": "This game is simple, familiar, and brilliant at this age. Most players already know the concept from the road. The player-generated colors keep it fresh and give them ownership. Look for players keeping the ball within arm's reach at yellow and actually stopping on red rather than letting the ball roll away.", "question": "What was the hardest color to remember? What action did you pick?"}}}, {"id": "101-dalmatians", "order": 18, "name": "101 Dalmatians", "block": "B1", "skills": ["Dribbling", "Scanning"], "ages": ["u6", "u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 25 by 20 yards with small cone triangles scattered throughout, about one triangle per player. Every player has a ball. Players score by dribbling through a triangle with the ball within arm's reach of their body. Players count their own score out loud and shout it each time they hit a triangle. The group goal is 101 combined. Your job is to roam the grid and knock balls away, going after your stronger players first.", "look_for": "Players using small touches to keep the ball close when you approach. Heads up to spot both the triangles and you coming. The counting keeps players invested in the team total.", "question": "How did you keep the ball safe when I came near you?", "pairs_with": ["red-light-green-light", "knockout"], "equipment": "1 ball per player · Disc cones for outer grid and inner triangles", "for_age": {"u6": {"setup": "Grid about 25 by 20 yards with cone triangles scattered throughout, one per player. Every player has a ball. Players score by dribbling through a triangle with the ball within arm's reach of their body. Players count their own score out loud and shout it each time they score. Set a group target before the game starts and count up together. Try 20 to start. If they get there quickly, raise it next round. Your job is to roam the grid and knock balls away. Go after your strongest players first.", "look_for": "Count up loudly with the group as the number climbs. The shared team goal creates genuine collective excitement when they hit the target. Raise the number each round to keep it challenging. Encourage small touches and heads up. Do not worry about perfect technique. Just getting the ball to the triangles is a win at this age.", "question": "How many did we get? Should we try for more next round?"}}}, {"id": "wreck-it-ralph", "order": 19, "name": "Wreck-It Ralph", "block": "B1", "skills": ["Dribbling", "Scanning", "Shooting"], "ages": ["u6", "u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 25 by 20 yards with a cone goal in each corner, opening inward. Every player has a ball. Players dribble around the grid and score by dribbling their ball through any corner goal while you (Wreck-It Ralph) roam and try to knock balls away. Ball knocked out: 10 toe taps to re-enter. Play short rounds of about a minute. Cone goals only, no small goals needed.", "look_for": "Players who look up to find an open goal before driving toward it. That is scanning in action. Encourage players to beat their own score each round.", "question": "Before you drove toward a goal, what did you check first?", "pairs_with": ["101-dalmatians", "shooting-gallery"], "equipment": "1 ball per player · Disc cones for grid and corner goals", "for_age": {"u6": {"setup": "Grid about 20 by 20 yards with a cone goal in each corner, opening inward. Every player has a ball. Players dribble around the grid and score by dribbling their ball through any corner goal. You are Wreck-It Ralph, roaming the grid and trying to knock balls away. Ball knocked out: 10 toe taps to re-enter. Play short rounds of about a minute. Encourage players to beat their own score.", "look_for": "Players who look up to find an open goal before driving toward it are already doing something sophisticated. Most will just head for the nearest goal, and that is completely fine at U6. Celebrate every goal loudly. The game introduces goal-scoring instinct without any coaching required.", "question": "How many goals did you score? Which goal was easiest to get to?"}}}, {"id": "duck-tails", "order": 20, "name": "Duck Tails", "block": "B1", "skills": ["Dribbling", "Protecting"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 20 by 20 yards. Every player has a ball and tucks a pinny in the back of their shorts. Players dribble around the space trying to steal a teammate's tail while protecting their own. Start with no elimination: if a tail falls off, tuck it back in and keep playing. For a final competitive round, switch to elimination: tail stolen means you are out. Last player with their tail wins. Count how many tails each player collects.", "look_for": "Players who face their opponent rather than just running away. That is the beginning of how they will take on a defender. Heads up to see where tails are and where opponents are coming from.", "question": "What did you do when someone came to steal your tail?", "pairs_with": ["knockout", "dinosaur-tag"], "equipment": "1 ball per player · Disc cones for grid · Pinnies as tails"}, {"id": "knockout", "order": 21, "name": "Knockout", "block": "B1", "skills": ["Protecting", "Dribbling"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 20 by 20 yards. Every player has a ball and dribbles freely. Players try to knock other players' balls out of the grid while keeping their own in. Ball knocked out: five toe taps outside the grid, then back in (non-elimination). For a final competitive round, switch to elimination: ball knocked out means you are out. Last player with their ball in the grid wins. Remind players to keep their ball close when an opponent approaches.", "look_for": "Players who shield the ball with their body rather than just running away. Players who look up to track both the ball and the incoming threat.", "question": "When someone came to knock your ball out, what did you do to protect it?", "pairs_with": ["duck-tails", "101-dalmatians"], "equipment": "1 ball per player · Disc cones for grid"}, {"id": "dinosaur-tag", "order": 22, "name": "Dinosaur Tag", "block": "B1", "skills": ["Dribbling", "Controlling"], "ages": ["u6", "u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 16}, "space": "quarter", "minutes": 20, "setup": "No outer boundary needed. Each pair sets up a triangle of three cones, with sides about 5 yards long. One player is the dinosaur, one is the park ranger. Both dribble around their triangle. The dinosaur tries to tag the park ranger. The park ranger can go any direction around the triangle but cannot leave the ball. Switch roles after every tag or after one minute. Hissing by the dinosaur is strongly encouraged.", "look_for": "Players learning to change direction quickly while keeping the ball close. Some players will struggle with the turns, and that is fine. Encourage small touches with both inside and outside of the foot. The competition drives the skill.", "question": "What did you do with the ball when you needed to change direction quickly?", "pairs_with": ["duck-tails", "shadow-dribbling"], "equipment": "1 ball per pair · 3 cones per pair to form a triangle", "for_age": {"u6": {"setup": "Each pair sets up a triangle of three cones with sides about 5 yards long. One player is the dinosaur, one is the park ranger. Both dribble around their triangle. The dinosaur tries to tag the park ranger. The park ranger can go any direction around the triangle but cannot leave the ball behind. Switch roles after every tag or after one minute. Hissing by the dinosaur is strongly encouraged.", "look_for": "Some players will struggle to turn the ball around the triangle corners. That is fine. The skill develops with time on the ball. Focus on the competition and the fun, not the technique. The pairs format means everyone is active simultaneously and no one is waiting. Watch for players using both feet.", "question": "What did you do when the dinosaur was catching up to you?"}}}, {"id": "gates-dribbling", "order": 23, "name": "Gates Dribbling", "block": "B1", "skills": ["Driving", "Scanning"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 25 by 20 yards with 8 to 10 gates scattered throughout. Each gate is two tall cones placed an arm's length apart. Every player has a ball. Score a point by dribbling through any gate. 60-second challenge: how many gates can you get through? Tell players to imagine a force field the size of their arms, and the ball should stay inside it while they dribble. Progress: call a specific cone color and players must look up to find those gates first.", "look_for": "Players who keep their head up find more gates. The game creates the need for scanning without you naming it. After the question, name it: \"That looking up while you dribble is called scanning.\"", "question": "How did you find the gates faster? What were you doing with your eyes?", "pairs_with": ["color-tag-dribble", "shadow-dribbling"], "equipment": "1 ball per player · 8 to 10 tall cones in pairs · Disc cones for grid · Timer"}, {"id": "shadow-dribbling", "order": 24, "name": "Shadow Dribbling", "block": "B1", "skills": ["Scanning", "Dribbling"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 2, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 25 by 20 yards. Players in pairs, each with their own ball. One player is the leader who dribbles however they want: fast, slow, turning, zigzagging. Their partner is the shadow, following close behind and mimicking every move. Switch roles every minute. If a leader tries something fancy, encourage the shadow to try it too even if it is not an exact copy.", "look_for": "The shadow must have their head up to follow the leader. Players who look at their own ball fall behind. The game builds the reflex to look up naturally, without you ever asking for it.", "question": "How did you stay close to your leader? What did you have to keep your eyes on?", "pairs_with": ["gates-dribbling", "dinosaur-tag"], "equipment": "1 ball per player · Disc cones for grid"}, {"id": "color-tag-dribble", "order": 25, "name": "Color Tag Dribble", "block": "B1", "skills": ["Scanning", "Driving"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 25 by 20 yards with colored tall cones placed around the space. Every player has a ball and dribbles freely. Hold up a colored cone and all players must dribble to touch a cone of that color before you count to ten. Vary the colors and the pace. Progress: have two callers with different colors at the same time so players must split their attention.", "look_for": "Players who keep their head up while dribbling reach the color fastest. Let the game teach the lesson. After the question, you can name it: \"That is scanning.\"", "question": "Who got to the cone fastest? What were you doing with your head while you were dribbling?", "pairs_with": ["gates-dribbling", "red-light-green-light"], "equipment": "1 ball per player · Multiple colored tall cones · Disc cones for grid"}, {"id": "shooting-gallery", "order": 26, "name": "Shooting Gallery", "block": "B1", "skills": ["Shooting", "Decision-Making"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 20, "setup": "Grid about 20 by 20 yards with a cone goal on the center of each side, all opening inward, four goals total. Every player has their own ball. Players dribble freely inside the grid and shoot at any goal they choose. After the shot, retrieve the ball and go again. No groups, no queues, everyone active the whole time. Challenge: how many different goals can you score on in 60 seconds?", "look_for": "Players who look up to find an open goal before driving toward it. Volume of attempts is the point: confidence to shoot develops now and accuracy comes with time. Celebrate every goal. A player who scores on all four goals in one round deserves a big reaction.", "question": "Before you shot, what did you look at?", "pairs_with": ["wreck-it-ralph", "2v1-to-goal"], "equipment": "1 ball per player · 8 tall cones for 4 goals (pairs, arm's length apart) · Disc cones for grid · Timer"}, {"id": "2v1-to-goal", "order": 27, "name": "2v1 to Goal", "block": "B2", "skills": ["Passing", "Numerical Advantage", "Decision-Making"], "ages": ["u8"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 3, "max": 15}, "space": "quarter", "minutes": 20, "setup": "Groups of 3. Two attackers against one defender, attacking a cone goal about 6 yards wide. Ball starts with one attacker around 10 yards out. Rotate roles every 30 seconds. Run 2 to 3 groups simultaneously depending on how many adults are available to manage them. Do not coach the pass: let players discover the advantage of having a teammate free. Rotate defenders regularly so they do not get discouraged.", "look_for": "Do not coach the combination. If a player passes to a free teammate and they score, celebrate it loudly and specifically: \"Did everyone see that? Two players just solved a problem that one player couldn't.\" That moment is the first seed of Me & My Teammates.", "question": "When you had two players against one defender, what options did you have? Did you use both of them?", "pairs_with": ["shooting-gallery"], "equipment": "1 ball per group · 2 tall cones per goal · Pinnies · Run 2 to 3 groups simultaneously"}, {"id": "half-and-half", "order": 28, "name": "Half and Half", "block": "B2", "skills": ["Supporting", "Combination Play"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "half", "minutes": 15, "setup": "Rectangular grid with goals at each end and a midpoint line of cones. 3v3 or 4v4. Normal scrimmage, except a goal only counts if the attacking team has at least one player in both their attacking AND defending halves when the goal is scored. The player who stays back is providing depth and defensive security.", "look_for": "Forces players to spread across the length of the field, not just the width. The player who stays in the defending half might miss the goal celebration. Acknowledge them specifically. US Soccer introduces depth of shape explicitly at U12. This game teaches it without you naming it.", "question": "The player who stayed back when your team scored: what were they protecting?", "pairs_with": ["flying-numbers", "barcelona"], "equipment": "1 ball · 2 small goals · Disc cones including midpoint line · Pinnies"}, {"id": "3v3-plus-1-keep-away", "order": 29, "name": "3v3+1 Keep-Away", "block": "B2", "skills": ["Possession", "Body Shape"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 7, "max": 14}, "space": "quarter", "minutes": 15, "setup": "Square of cones for every 7 players. Two teams of 3 in different colors, one neutral player who plays with whoever has the ball. Attackers rack up passes. When defenders win it, the neutral player switches sides immediately. No delay. After a minute, switch roles.", "look_for": "The neutral player switching sides instantly is the whole point. That instant role switch seeds transition awareness naturally inside a possession game. Also look for players opening their hips to receive before the ball arrives. Works well as Activity B after Flying Numbers.", "question": "When the ball turned over, how quickly did you read whose team you were joining or defending against?", "pairs_with": ["flying-numbers"], "equipment": "1 ball per grid · 4 cones per square · 3 colors of pinnies"}, {"id": "2v2v2-keep-away", "order": 30, "name": "2v2v2 Keep-Away", "block": "B3", "skills": ["Pressing", "Covering"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 18}, "space": "quarter", "minutes": 15, "setup": "Square of cones for every 6 players. Three pairs in different colors. Two pairs attack and keep the ball away from the defending pair. When defenders steal or force a mistake, they replace the attacking pair who last touched the ball. Immediately, no stoppages. The new defenders must get into position fast.", "look_for": "The defending pair must communicate constantly: who pressures the ball, who covers behind. Look for the pair who splits those jobs naturally. The team that defends compactly wins the ball most often.", "question": "When you were the defending pair, how did you decide who would press the ball and who would cover?", "pairs_with": ["flying-numbers", "half-court-soccer"], "equipment": "1 ball per grid · 4 cones per square · 3 colors of pinnies"}, {"id": "half-court-soccer", "order": 31, "name": "Half Court Soccer", "block": "B3", "skills": ["Compact Shape", "Marking"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 14}, "space": "half", "minutes": 15, "setup": "Rectangular grid, wider than it is long. A check line at one end, the goal at the other. Both teams attack the same goal, like half-court basketball. If a team steals the ball, they must clear it by dribbling over the check line before they can attempt to score. Play 3v3 plus an optional rotating goalkeeper.", "look_for": "The check line creates a natural defending moment. Defenders must get compact between the ball and the goal. When the attack clears the line and comes back, defenders must re-organize quickly. Watch for players who position between opponent and goal rather than just chasing the ball.", "question": "When the other team was dribbling toward goal, where were you standing? Between the ball and the goal, or somewhere else?", "pairs_with": ["2v2v2-keep-away", "flying-numbers"], "equipment": "1 ball · 1 goal · Disc cones including check line · Pinnies"}, {"id": "shrinking-field-defending", "order": 32, "name": "Shrinking Field: Defending Focus", "block": "B3", "skills": ["Compact Shape", "Pressing"], "ages": ["u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Rectangular grid with small goals at each end. 3v3 or 4v4. Every minute, move each touchline in by 3 steps. Explicitly frame it as a defending focus before starting: \"today we are watching the defending team, not the attacking team.\" Play 2 to 3 rounds.", "look_for": "As the field shrinks, the compact defending shape becomes more and more important. Watch for the defending team getting tighter: closer together, higher up, forcing play to one side. Are they reacting to the ball or anticipating where it is going? Any moment of anticipation is worth highlighting.", "question": "As the field got smaller, did defending get easier or harder? What does that tell you about defending in tight spaces?", "pairs_with": ["half-court-soccer", "2v2v2-keep-away"], "equipment": "1 ball · 2 small goals · Disc cones", "for_age": {"u14": {"setup": "Rectangular grid with small goals at each end. 4v4 or 5v5. Every minute, move each touchline in by 3 steps. Tell them before you start: \"today we are watching the defending team.\" Play 2 to 3 rounds.", "look_for": "As the field shrinks, compact shape matters more and more. Watch for the defending team getting tighter: closer together, higher up, forcing play to one side. Are they reacting to the ball or anticipating where it is going? Anticipation is worth naming.", "question": "As the field got smaller, did defending get easier or harder? What does that tell you about defending in tight spaces?"}}}, {"id": "flying-numbers-transition", "order": 33, "name": "Flying Numbers: Transition Focus", "block": "B4", "skills": ["Decision-Making", "Communication"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 8, "max": 20}, "space": "half", "minutes": 15, "setup": "Same as the opening game anchor, but now explicitly framed around transition. Outgoing players must sprint off the field. Incoming players must sprint on. No walking at any point during rotation. Call the numbers quickly so there is barely any gap between rounds.", "look_for": "The transition moment is the entire point. What happens the instant a goal is scored or the ball goes out? Do players react and sprint in, or shuffle in? Urgency in transition is a habit and habits form through repetition. This is why Flying Numbers appears in both the anchor and focus roles.", "question": "What is the difference between a team that sprints into transition and a team that walks? How does that change what the other team can do?", "pairs_with": ["crisscross", "hawaii"], "equipment": "1 ball · 2 goals · Disc cones · Pinnies"}, {"id": "crisscross", "order": 34, "name": "Crisscross", "block": "B4", "skills": ["Decision-Making", "Scanning"], "ages": ["u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 15, "setup": "Square grid with a goal on the middle of each side, 4 goals total. One team scores on the two endline goals; the other scores on the two touchline goals. Play 2v2 or 3v3. Score by passing through a goal to a teammate. The cross-axis attack means defenders must constantly re-orient.", "look_for": "Trains the transition instinct directly: the instant you win the ball, find the goal immediately. Players who hesitate give defenders time to recover. Players who look up the moment they win possession and find a goal in one or two actions are showing what the transition block looks like in practice.", "question": "How quickly after winning the ball did you find your target? What would have happened if you waited two more seconds?", "pairs_with": ["flying-numbers-transition", "hawaii"], "equipment": "1 ball · 4 cone goals (pairs, arm's length apart) · Pinnies", "for_age": {"u14": {"setup": "Square grid with a goal in the middle of each side, 4 goals total. One team scores on the two endline goals, the other on the two touchline goals. Play 3v3 or 4v4. Score by passing through a goal to a teammate. The cross-axis attack forces defenders to re-orient constantly.", "look_for": "The instant a team wins the ball, do they look up and find a target within one or two actions? Players who hesitate give defenders time to recover. That first-second decision is the whole transition idea.", "question": "How quickly after winning the ball did you find your target? What would have happened if you waited two more seconds?"}}}, {"id": "hawaii", "order": 35, "name": "Hawaii", "block": "B4", "skills": ["Decision-Making", "Pressing"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "half", "minutes": 15, "setup": "Square grid. Two goals set back about 5 yards from each end, one per team. 3v3 or 4v4. Players can score on either goal on their end line but must shoot from inside the grid. Keep extra balls next to you and feed them in immediately after each score or out-of-bounds. Continuous play, no stoppages.", "look_for": "The continuous play means players are constantly switching between attack and defense. Watch for who reacts instantly versus who celebrates and switches off. Relentless transitions make this the most game-realistic activity in this group.", "question": "When a new ball came in while you were still celebrating a goal, how quickly did you switch back to defending?", "pairs_with": ["flying-numbers-transition", "crisscross"], "equipment": "Multiple balls (keep several nearby) · 4 goals in 2 pairs · Disc cones · Pinnies"}, {"id": "hotbox", "order": 36, "name": "Hotbox", "block": "B2", "skills": ["Combination Play", "Decision-Making"], "ages": ["u12", "u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "half", "minutes": 15, "setup": "Rectangular grid with a small goal at each end and a no-go square (the hotbox) in the center. 3v3 or 4v4. Players cannot enter the hotbox. Only balls can pass through. When the attackers' path is blocked by the hotbox and a defender on one side, the solution is to switch the ball to the other side.", "look_for": "Naturally brings in all four blocks in a single activity: ball mastery under pressure, switching the point of attack, cutting off lanes around the hotbox, and instant reaction on turnover. Best used in week 7 to observe all four without isolating any one.", "question": "When your path was blocked, what did you do? And when the ball turned over, what was your first movement?", "pairs_with": ["team-handball", "five-goal-game"], "equipment": "1 ball · 2 small goals · Disc cones for outer grid and hotbox square · Pinnies", "for_age": {"u14": {"setup": "Rectangular grid with a small goal at each end and a no-go square (the hotbox) in the center. 4v4 or 5v5. Players cannot enter the hotbox. Only the ball can pass through it. When the attackers' path is blocked by the hotbox and a defender, the solution is to switch the ball to the other side.", "look_for": "Generates all five blocks in a single game: ball skills under pressure, switching with teammates, cutting off lanes around the box, instant reaction on turnovers, and a decisive finish when the opening appears. Best used in week 7 to observe without isolating any one block. Do not over-coach. Watch.", "question": "When your path was blocked, what did you do? And when the ball turned over, what was your first movement?"}}}, {"id": "team-handball", "order": 37, "name": "Team Handball", "block": "B2", "skills": ["Combination Play", "Supporting"], "ages": ["u12"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 8, "max": 18}, "space": "half", "minutes": 15, "setup": "Mark space with 4 cones, goals at each end. Two teams. Players use their hands to pass and catch. They can run with the ball but only for three steps. Score with your feet, but only after a teammate passes you the ball. No dropping to yourself. If the ball hits the ground, goes out, or is intercepted, it is a turnover.", "look_for": "Using their hands makes it easier for players to keep their heads up and see their teammates' positions. Because scoring requires an assist, combination play is mandatory, not optional. The three-step limit creates natural transition moments. Good final-week activity before the closing game.", "question": "Because you had to score from a pass, what did you do differently in terms of your positioning than in a normal game?", "pairs_with": ["hotbox", "five-goal-game"], "equipment": "1 ball (any type) · 2 goals · Disc cones · Pinnies"}, {"id": "sharks-and-minnows", "order": 38, "name": "Sharks and Minnows", "block": "D", "skills": ["Dribbling", "Scanning"], "ages": ["u6"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 14}, "space": "quarter", "minutes": 10, "setup": "Mark a rectangle and call it the ocean. Every player is a minnow with their own ball. You are the shark. Minnows line up along one end and on your signal they all dribble to the other side without getting their ball knocked away by you. Any minnow whose ball is knocked out becomes a shark and joins you for the next crossing. Minnows who make it safely line up and go again. Play until everyone has become a shark, then start fresh with a new volunteer as the first shark.", "look_for": "Encourage minnows to keep their heads up to find gaps, small touches to get around the sharks, and bigger touches to escape when they have space. The game is self-regulating as more sharks appear. Go after your more confident players first.", "question": "How did you get past the shark? Did you go fast or did you go around?", "pairs_with": ["octopus", "kangaroo-jacks"], "equipment": "1 ball per player · Disc cones for rectangle"}, {"id": "octopus", "order": 39, "name": "Octopus", "block": "D", "skills": ["Dribbling", "Driving"], "ages": ["u6"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 14}, "space": "quarter", "minutes": 10, "setup": "Mark a square grid and call it the ocean. Every player has a ball and dribbles freely anywhere in the grid. You are the octopus, roaming the grid trying to tag players. If tagged, it is 10 toe taps to get back in. Hold two pool noodles as tentacles if you have them. They make no practical difference and players will absolutely love it. Unlike Sharks and Minnows, there is no crossing from side to side: players move freely in all directions and must dodge you wherever they go.", "look_for": "Look for players using small touches to dodge around you and bigger touches to escape when they have space. Slow down for players who need more success, speed up for players who need more challenge. The free-roaming format means every player is always active, which keeps energy high.", "question": "When I came toward you, how did you decide which way to go?", "pairs_with": ["sharks-and-minnows"], "equipment": "1 ball per player · Disc cones for grid · 2 pool noodles as tentacles (optional but highly recommended)"}, {"id": "kangaroo-jacks", "order": 40, "name": "Kangaroo Jacks", "block": "D", "skills": ["Dribbling", "Controlling"], "ages": ["u6"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 14}, "space": "quarter", "minutes": 10, "setup": "Rectangle about 20 by 15 yards. One or two volunteers are the Kangaroo Jacks. Everyone else has a ball. Kangaroo Jacks must hop everywhere they go. Players dribble from one side of the grid to the other without getting tagged by a hopping Kangaroo Jack. If tagged, that player becomes a Kangaroo too. After a minute or so, call time, catch your breath, and play again.", "look_for": "The hopping is the whole point. Two-footed hopping is genuinely difficult for many 5 and 6 year olds and they will fall over and think it is hilarious. That is fine. Let them. The coordination work happening in this game is foundational to athletic development and they will never know they are training.", "question": "When more kangaroos appeared, how did you find space to dribble?", "pairs_with": ["bunny-trail", "snake"], "equipment": "1 ball per player (except kangaroos) · Disc cones for rectangle"}, {"id": "snake", "order": 41, "name": "Snake", "block": "D", "skills": ["Communication", "Scanning"], "ages": ["u6"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 10, "setup": "Grid about 20 by 20 yards. One player is the head of the snake, the only player without a ball. Everyone else dribbles freely. The snake runs around trying to tag other players. When tagged, a player grabs the back of the snake's shirt and joins the snake. The snake grows with every tag. They must stay connected for a tag to count. The game ends when everyone has become part of the snake. Start again with a new volunteer as the head.", "look_for": "The snake will fall apart constantly. That is the fun. Encourage the snake to communicate and call out who they are going after. Remind non-snakes to keep their heads up to find snake-free space. Watch for moments of genuine teamwork as the snake gets longer. Hissing is encouraged and should be modeled by the coach.", "question": "When you were in the snake, how did you decide which direction to go?", "pairs_with": ["kangaroo-jacks"], "equipment": "1 ball per player (except the snake head) · Disc cones for grid"}, {"id": "bunny-trail", "order": 42, "name": "Bunny Trail", "block": "D", "skills": ["Dribbling", "Controlling"], "ages": ["u6"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 4, "max": 16}, "space": "quarter", "minutes": 10, "setup": "Create a circle of cones spaced about 6 feet apart. Each player starts at a cone with their own ball. On your call, players either dribble to the next cone or hop while carrying their ball. Alternate between dribbling and hopping segments on your command. Tell players to imagine a force field the size of their arms and to keep the ball inside it while they dribble.", "look_for": "The dribbling and hopping alternate creates a natural rhythm, and the coordination challenge of switching between the two is the whole point. Some players will struggle with two-footed hopping. Demonstrate it and encourage the attempt. Do not run more than three hopping segments in a row or energy will drop.", "question": "Which was harder, dribbling or hopping? Why?", "pairs_with": ["kangaroo-jacks"], "equipment": "1 ball per player · 1 cone per player arranged in a circle"}, {"id": "mosquitoes", "order": 43, "name": "Mosquitoes", "block": "D", "skills": ["Dribbling", "Shooting", "Scanning"], "ages": ["u6"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 16}, "space": "quarter", "minutes": 10, "setup": "Small grid about 15 by 15 yards. Divide players into two groups: mosquitoes (each with a ball) and campers (no ball). Mosquitoes dribble their ball and try to hit campers below the knee. When a mosquito lands a hit, that player switches roles. Play until you call time. Keep the grid small so players have to dribble close before striking rather than shooting from distance.", "look_for": "The game is controlled chaos and that is the point. It combines dribbling, shooting and spatial awareness in a genuinely silly format that 6-year-olds love. Watch for players who dribble close before shooting rather than kicking from far away. If balls are consistently going high, narrow the space further or switch to a different game.", "question": "How did you sneak up on your camper without them getting away?", "pairs_with": ["octopus"], "equipment": "1 ball per mosquito · Disc cones for grid"}, {"id": "duels-to-goal", "order": 44, "name": "Duels to Goal", "block": "B5", "skills": ["Shooting", "Decision-Making"], "ages": ["u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 6, "max": 20}, "space": "half", "minutes": 15, "setup": "Two lines of players about 25 yards from a full-size goal with a goalkeeper (rotate keepers often). The coach plays a ball in. The first attacker and first defender race to it and play 1v1 to goal. Shot, save, miss or ball out ends the duel. Next pair goes. Keep the pace quick: three or four duels per player, then swap roles.", "look_for": "The moment of decision: does the attacker commit, or hesitate and give the defender time? Look for the attacker who takes one decisive touch toward goal, and for the player who shoots early instead of dribbling one extra time. For defenders, look for patience: delay, do not dive in.", "question": "When you had the ball facing the goalkeeper, what did you decide first: shoot, dribble, or pass? What told you that?", "pairs_with": ["flying-numbers", "waves"], "equipment": "Balls in a bag · 1 full-size goal · Disc cones · Pinnies"}, {"id": "waves", "order": 45, "name": "Waves", "block": "B5", "skills": ["Numerical Advantage", "Passing", "Shooting"], "ages": ["u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 8, "max": 20}, "space": "full", "minutes": 15, "setup": "Full-size goal with a goalkeeper. Three attackers start from the halfway line against two defenders and attack in waves. When the wave finishes (goal, save, or ball out), the three attackers become the next wave's defenders, and the two defenders go to the back of the attacking line. Coach feeds a new ball in right away so play is continuous.", "look_for": "Numbers-up decisions are the heart of this one. Watch for the attacker who carries the ball until a defender commits, then passes. Watch for the third attacker arriving late into the box. Celebrate a good final pass as loudly as the goal.", "question": "With three against two, who decided when to pass and when to shoot? How did you know?", "pairs_with": ["duels-to-goal", "wide-service-finishing"], "equipment": "Balls in a bag · 1 full-size goal · Disc cones · Pinnies in 2 colors"}, {"id": "wide-service-finishing", "order": 46, "name": "Wide Service Finishing", "block": "B5", "skills": ["Shooting", "Supporting"], "ages": ["u14"], "tracks": ["rec"], "levels": ["intro"], "players": {"min": 8, "max": 18}, "space": "half", "minutes": 15, "setup": "Full-size goal with a goalkeeper. Wide players on each flank serve balls into the box while two or three attackers arrive to finish. Start with serves along the ground or driven low, finish with feet. Once the group is confident, add a defender in the box. Rotate servers, finishers and the goalkeeper every few turns. Heading is optional: if you include it, use a lighter ball, toss to the head from short range, and keep the total number of headers very low.", "look_for": "Do the attackers time their runs so they arrive as the ball does, rather than standing in the box waiting? Do they attack the near post and far post with different players? Watch for the serve itself: low and hard, away from the goalkeeper, is hard to defend.", "question": "When the cross came in, how did you decide where to run? What did your teammate do differently from you?", "pairs_with": ["waves", "flying-numbers"], "equipment": "Balls in a bag · 1 full-size goal · Disc cones for the wide channels · Pinnies"}], "teams": [{"id": "u6-rec", "age": "u6", "track": "rec", "label": "U6", "plan": {"id": "u6-rec", "age": "u6", "track": "rec", "sessions_per_week": 1, "slot_labels": {"a": "First activity", "b": "Second activity"}, "weeks": [{"week": 1, "focus": "Moving with the ball", "sessions": [{"a": {"activity": "red-light-green-light", "note": "Ball close at yellow, a real stop at red"}, "b": {"activity": "octopus", "note": "Small touches to dodge, bigger touches to escape"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 2, "focus": "Dodging and changing direction", "sessions": [{"a": {"activity": "sharks-and-minnows", "note": "Heads up to find the gaps"}, "b": {"activity": "kangaroo-jacks", "note": "Let the hopping be silly. The coordination work is real"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 3, "focus": "Counting, scoring and heads up", "sessions": [{"a": {"activity": "101-dalmatians", "note": "Count together and raise the target each round"}, "b": {"activity": "snake", "note": "Players calling out who they are chasing"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 4, "focus": "Both feet, turns and hops", "sessions": [{"a": {"activity": "dinosaur-tag", "note": "Watch for both feet on the turns"}, "b": {"activity": "bunny-trail", "note": "Keep hopping segments to three in a row at most"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 5, "focus": "Finding the goal", "sessions": [{"a": {"activity": "wreck-it-ralph", "note": "Celebrate every goal loudly"}, "b": {"activity": "sharks-and-minnows", "note": "Revisit: can they find the gaps faster?"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 6, "focus": "Silly games, real skills", "sessions": [{"a": {"activity": "mosquitoes", "note": "Dribble close before striking. Keep the grid small"}, "b": {"activity": "octopus", "note": "Revisit: dodging with a smile"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 7, "focus": "Favorites", "sessions": [{"a": {"activity": "101-dalmatians", "note": "Revisit: beat last time's group total"}, "b": {"activity": "mosquitoes", "note": "Revisit: keep shots below the knee"}}], "block": "D", "level": "intro", "also_blocks": ["B1"]}, {"week": 8, "focus": "Coach's choice", "coach_choice": true, "note": "Run what your group loves most. If they are begging for more, you picked right."}]}, "goals": [{"id": "runs-to-ball", "text": "Runs toward the ball instead of away from it", "blocks": ["D"]}, {"id": "moves-with-ball", "text": "Moves with the ball rather than kicking it away", "blocks": ["D"]}, {"id": "finds-goal", "text": "Knows where the goal is and tries to shoot at it", "blocks": ["D"]}, {"id": "wants-to-return", "text": "Shows up to the next session excited to play again", "blocks": ["D"]}], "players": {"id": "u6", "age": "u6", "who": [{"label": "They are just starting", "text": "For many of these players, this is their first experience on a team. Some have never kicked a ball. Start with zero assumptions about what they know. Everything is new and that is a gift. You get to be the person who introduces them to the game."}, {"label": "Fun is the curriculum", "text": "At this age, fun is not a means to an end. It is the end. A player who loves being on the field at age 6 is a player who is still playing at 16. A player who has a bad experience now may never come back. That is the real stakes here."}, {"label": "Movement matters more than you think", "text": "The hopping, the turning, the chasing, the changing direction. These are not just games. They are building the coordination, balance and agility that underpin every athletic skill your players will ever develop. The animal games are doing real work, even when it looks like pure chaos. You do not need to tell the players any of that. Just run the game and let them be ridiculous."}, {"label": "Short attention spans are normal", "text": "A six-year-old has about 6 to 8 minutes of focused attention before they need a reset. This is not misbehavior, it is how kids this age work. Keep activities short. Switch often. If something is not working, just move on. You do not need to fix it."}], "great_session": [{"title": "Constant movement", "text": "Players are running, chasing, dribbling, hopping or laughing for almost every minute of the session. If players are standing still waiting, the game needs to change."}, {"title": "Noise and joy", "text": "The louder and more chaotic it sounds, the better. Squealing, giggling, shouting animal names. This is exactly what success sounds like at U6."}, {"title": "Every player has a ball", "text": "During practice activities, every player should have their own ball at their feet as much as possible. Waiting in line or sharing kills engagement at this age."}, {"title": "Lots of goals", "text": "Set up games where players score frequently. Nothing builds confidence and excitement faster than scoring a goal. Celebrate every single one."}, {"title": "The coach is playing too", "text": "At U6, you are not standing on the sideline with a clipboard. You are the shark. You are Wreck-It Ralph. Get in there. Your energy sets the tone for the whole session."}, {"title": "It ends too soon", "text": "If players are asking \"can we play more?\" when the session ends, you have done your job perfectly. End while they still want more, every single week."}], "prepared": "Preparation at U6 is simple. Know which two activities you are going to run. Have your cones laid out before the first player arrives. Put a ball at every player's starting spot. That is it. You do not need a session plan with timing breakdowns. You need to show up with energy and an idea of what game you are playing first. The rest follows.", "parents": {"intro": "U6 parents are more anxious than any other age group, and more likely to intervene. Before the session, walk over and say something like:", "script": "These sessions are going to look like organized chaos, and that is completely intentional. The games are silly on purpose. Every one of them is building coordination, confidence, and a love of the ball. The best thing you can do is cheer loudly and let them figure things out for themselves. If they run to you mid-game, just point them back to the field with a smile.", "outro": "At this age, a crying player who came to the field is still a win. Stay warm, stay calm, and keep things moving. Most players warm up within a few sessions."}, "shape": {"title": "The session", "note": "About 45 to 50 minutes. Arrive 15 minutes early. Opening game, two activities of about 10 minutes, closing game.", "opening": {"label": "Warm-up game", "minutes": "8 to 10 min", "title": "Small-sided game, free play", "setup": "Same setup every week. Mini or pop-up goals at each end if you have them, cone goals otherwise. Pop-up goals give players the satisfaction of the ball going into a net, which matters at this age. Split however many players you have into two roughly equal teams. No goalkeeper, no offside, no rules beyond kick-in restarts. Keep the field small enough that every player is near the action most of the time. When in doubt, go smaller. Mark the space, put the ball down, and step back. Restart quickly after every goal and celebrate each one.", "job": "Get in there a little. Encourage. High-five. React to goals like they are the greatest thing you have ever seen. At U6, your energy is contagious in both directions. Do not coach. Do not correct. Just play.", "question": "What was your favorite part of today?", "kit": "1 ball per team · Mini or pop-up goals (cone goals as fallback) · Disc cones for boundaries · Pinnies in 2 colors"}, "closing": {"label": "Final game", "minutes": "10 min", "title": "Back to play", "setup": "Same small-sided game as the opening. Same teams or mix them up, either works. Let it run without interruption. Your job is to restart quickly after goals and keep the energy up. Bring everyone in at the end. High-fives all around, then one very simple question to close the loop. End while they still want more.", "question": "What was your favorite part of today?", "kit": "1 ball per team · Mini or pop-up goals (cone goals as fallback) · Disc cones for boundaries · Pinnies in 2 colors"}}, "cues": [{"when": "Player is standing still or disengaged", "say": "Go to them. Get a ball at their feet. Get them moving. Do not ask what is wrong in front of the group. Just play alongside them for a minute."}, {"when": "Player is upset or crying", "say": "Kneel down, speak quietly, and give them a moment. Do not rush them back in. Most players come back on their own when they are ready. Keep the game going so they have something to come back to."}, {"when": "Player runs to their parents mid-game", "say": "Normal. Let the parent redirect them back. If it happens every session, have a quiet word with the parent about how to respond."}, {"when": "Player scores a goal", "say": "React like it is the greatest thing you have ever seen. Name the player. Make the celebration visible. At U6, that moment of recognition is more valuable than any coaching point."}, {"when": "Game is getting too chaotic", "say": "That is usually fine. If it genuinely breaks down, call a quick freeze, give one simple instruction, and restart. Do not stop the game for more than 30 seconds."}, {"when": "Players are not listening to instructions", "say": "Keep instructions to one sentence. Demonstrate rather than explain. If they are not listening, start the game and they will figure it out."}]}, "framework": {"age": "u6", "blocks": {"D": {"tagline": "Move with the ball. Heads up. Have fun.", "overview": "There are no player action frameworks, no tactical concepts and no positional requirements at this age. Just three things, said plainly, that you can come back to in any game at any moment. Fun is the most important one, and the one coaches forget most often.", "problem": "Players fall in love with the game: moving with the ball, looking up, and wanting to come back next week.", "focus": ["Move with the ball: keep it close, use your feet, take it with you", "Heads up: see what is around you, find space, see your teammates", "Have fun"]}}}, "skills": [{"id": "u6-d-move-with-the-ball-intro", "age": "u6", "block": "D", "area": "Move with the ball", "level": "intro", "tracks": ["rec"], "bullets": ["Keep the ball close", "Use your feet to take it with you", "Run toward the ball instead of away from it"]}, {"id": "u6-d-heads-up-intro", "age": "u6", "block": "D", "area": "Heads up", "level": "intro", "tracks": ["rec"], "bullets": ["See what is around you", "Find space", "See your teammates"]}, {"id": "u6-d-have-fun-intro", "age": "u6", "block": "D", "area": "Have fun", "level": "intro", "tracks": ["rec"], "bullets": ["Smile, laugh and make noise while playing", "Celebrate every goal", "Show up excited for the next session"]}], "club": {"format": "5v5", "rules": [{"label": "Format", "text": "SGSC plays 5v5 at this age.", "source": "Sierra Gold Soccer Club"}]}, "rules": [{"label": "Format", "text": "SGSC plays 5v5 at this age.", "source": "Sierra Gold Soccer Club", "origin": "club"}, {"label": "Ball", "text": "Size 3", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Field", "text": "25 to 35 yards long, 15 to 25 yards wide", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Goals", "text": "Up to 4 feet high, 6 feet wide", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Game time", "text": "4 quarters of 10 minutes", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Goalkeeper", "text": "No goalkeeper", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Offside", "text": "No offside", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Heading", "text": "Not allowed in practice or games", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Substitutions", "text": "Unlimited, at any time", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Rosters", "text": "No formal rosters. About 6 players per team is suggest
