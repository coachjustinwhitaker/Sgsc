l", "Recognize when the team is too spread out and close the gaps", "Re-apply pressure as soon as a teammate is beaten"]}, {"id": "u10-b3-denying-the-finish-intro", "age": "u10", "block": "B3", "area": "Denying the Finish", "level": "intro", "tracks": ["rec", "comp"], "bullets": ["Get narrow and close the center near goal", "Stop the cross and block the shot", "Stay on your feet until the shot is taken"]}, {"id": "u10-b3-denying-the-finish-dev", "age": "u10", "block": "B3", "area": "Denying the Finish", "level": "dev", "tracks": ["comp"], "bullets": ["Choose between blocking the shot and staying goal-side", "Step in to challenge when the opponent has a chance on goal", "Cover the near post area when the ball is wide"]}], "club": {"format": "7v7"}, "rules": [{"label": "Format", "text": "7v7", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Ball", "text": "Size 4", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Field", "text": "55 to 65 yards long, 35 to 45 yards wide", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Goals", "text": "Up to 6.5 feet high, 18.5 feet wide", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Game time", "text": "2 halves of 25 minutes", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Goalkeeper", "text": "Goalkeeper", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Offside", "text": "Offside applies", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Heading", "text": "Not allowed in practice or games", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Build-out line", "text": "Used at 7v7. When the goalkeeper has the ball in hand or takes a goal kick, opponents stay behind the line until the ball is in play. No offside between the halfway line and the build-out line. Your league sets where the line goes.", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Substitutions", "text": "Unlimited, at any stoppage", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Rosters", "text": "Up to 12 players. A team needs at least 5 to start or continue.", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Head injuries", "text": "If a head injury is suspected, play stops for evaluation. The player may be substituted. Return requires clearance from a health care professional or certified athletic trainer.", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}], "ladder": ["B1", "B2", "B3"]}, {"id": "u12-rec", "age": "u12", "track": "rec", "label": "U12", "plan": {"id": "u12-rec", "age": "u12", "track": "rec", "sessions_per_week": 2, "weeks": [{"week": 1, "focus": "Me & the Ball and Me & My Teammates in a bigger game", "sessions": [{"a": {"activity": "flying-numbers", "note": "High energy, variable pressure. Settles the group into the new format"}, "b": {"activity": "half-and-half", "note": "Depth in shape: at least one player in each half for a goal to count"}}, {"a": {"activity": "3v3-plus-1-keep-away", "note": "Neutral player switches instantly on turnover. Seeds transition"}, "b": {"activity": "barcelona", "note": "Patience and pass counting: points equal the number of passes before scoring"}}], "block": "B2", "level": "intro"}, {"week": 2, "focus": "Consolidating combination play before new focuses", "sessions": [{"a": {"activity": "flying-numbers", "note": "Call uneven numbers (2v1, 3v2) to demand decisions"}, "b": {"activity": "five-goal-game", "note": "Change target when the path is blocked: combination play under decision pressure"}}, {"a": {"activity": "barcelona", "note": "Revisit: can they beat last week's pass count before scoring?"}, "b": {"activity": "team-handball", "note": "Must score from a pass, so combination play is mandatory"}}], "block": "B2", "level": "intro"}, {"week": 3, "focus": "Team defending introduced", "sessions": [{"a": {"activity": "flying-numbers", "note": "Anchor: familiar, resets energy between the two new concepts"}, "b": {"activity": "2v2v2-keep-away", "note": "Who presses, who covers? The first and second defender chain begins"}}, {"a": {"activity": "2v2v2-keep-away", "note": "Revisit: add a 2-touch limit to increase pressure on defenders"}, "b": {"activity": "half-court-soccer", "note": "Clear the ball over the check line before scoring: compact defending shape"}}], "block": "B3", "level": "intro"}, {"week": 4, "focus": "Team defending deepens: shape and pressure together", "sessions": [{"a": {"activity": "half-court-soccer", "note": "Revisit: now frame it explicitly as a defending focus"}, "b": {"activity": "shrinking-field-defending", "note": "Compact shape becomes critical as space disappears"}}, {"a": {"activity": "shrinking-field-defending", "note": "Revisit: ask did defending get easier or harder, and why?"}, "b": {"activity": "2v2v2-keep-away", "note": "Consolidation: can the defending pair now communicate without being reminded?"}}], "block": "B3", "level": "intro"}, {"week": 5, "focus": "Transitions introduced: both moments", "sessions": [{"a": {"activity": "flying-numbers-transition", "note": "Outgoing players sprint off, incoming players sprint on. No walking"}, "b": {"activity": "crisscross", "note": "Four goals on different axes: find the goal instantly after winning the ball"}}, {"a": {"activity": "crisscross", "note": "Revisit: how quickly after winning the ball do they find a target?"}, "b": {"activity": "hawaii", "note": "Continuous play, no stoppages: relentless transitions both ways"}}], "block": "B4", "level": "intro"}, {"week": 6, "focus": "Transition moments deepen: urgency becoming habit", "sessions": [{"a": {"activity": "hawaii", "note": "Revisit: feed new balls in even faster. No celebrations mid-session"}, "b": {"activity": "flying-numbers-transition", "note": "Revisit with emphasis: watch who reacts and who watches when the ball goes out"}}, {"a": {"activity": "five-goal-game", "note": "Win the ball, find the goal immediately: both transitions in one game"}, "b": {"activity": "hotbox", "note": "Switch the point of attack plus an immediate transition reaction"}}], "block": "B4", "level": "intro", "also_blocks": ["B2"]}, {"week": 7, "focus": "Integration: all four blocks in play together", "sessions": [{"a": {"activity": "hotbox", "note": "All four blocks in one game. Do not over-coach. Watch"}, "b": {"activity": "team-handball", "note": "Must assist to score: combination play, positioning and transition"}}, {"a": {"activity": "five-goal-game", "note": "Integration game: observe all four blocks without coaching any one"}, "b": {"activity": "3v3-plus-1-keep-away", "note": "Final consolidation: transition, possession and defending all present"}}], "block": "B4", "level": "intro", "also_blocks": ["B1", "B2", "B3"]}, {"week": 8, "focus": "Coach's choice both days", "coach_choice": true, "note": "What does your group love most? What do they still need most? Run your two best sessions of the season. Both are correct answers."}]}, "goals": [{"id": "keeps-ball-pressure", "text": "Keeps the ball under pressure with confidence", "blocks": ["B1"]}, {"id": "passes-and-moves", "text": "Passes and moves without needing to be reminded", "blocks": ["B2"]}, {"id": "defends-as-team", "text": "Defends as part of a team, not just individually", "blocks": ["B3"]}, {"id": "reacts-to-turnover", "text": "Reacts to the moment the ball changes hands", "blocks": ["B4"]}, {"id": "communicates", "text": "Communicates with and coaches teammates on the field", "blocks": ["B2", "B3"]}, {"id": "team-identity", "text": "Competes in 9v9 with real team identity", "blocks": ["B1", "B2", "B3", "B4"]}, {"id": "wants-to-play", "text": "Shows up wanting to play again", "blocks": ["B1", "B2", "B3", "B4"]}], "players": {"id": "u12", "age": "u12", "who": [{"label": "They have been around the game", "text": "Most of these players have been playing for several years. They are still developing their understanding that passing creates space and that defending takes real collective effort. They are ready to be coached on how their individual actions connect to what the team is doing."}, {"label": "How you deliver feedback matters", "text": "Players at this age are more aware of how they look in front of their peers. When you have something to say to an individual, find something they did right first. Save whole-group feedback for moments of collective success, not individual correction."}, {"label": "Two practices build habits", "text": "With two sessions a week, what you introduce on day one has time to settle before day two builds on it. Pay attention to what shows up in the second session without you asking for it. That carry-over is the sign the concept is taking hold."}, {"label": "Ask them why, not just what", "text": "Players at this age can answer deeper questions. \"Why does switching the ball make the defender's job harder?\" is a question a U12 player can genuinely engage with. Use that."}], "great_session": [{"title": "Immediate reaction to transition", "text": "When the ball turns over, do players react instantly? Or do they watch it happen? That first-second reaction is the whole introduction to the game-moments block."}, {"title": "Compact defending shape", "text": "Are defenders close enough to support each other? The distance between first and second defender tells you everything about their shape."}, {"title": "Combination play happening naturally", "text": "Players who are passing and moving without being asked are showing that the habits from U10 are sticking. If it is not happening yet, go back to a simpler passing activity. The habit builds with repetition."}, {"title": "Players coaching each other", "text": "US Soccer notes this explicitly at U12: player-to-player coaching is a development goal, not just a nice thing to see. Step back when it happens."}, {"title": "Practice A concept in Practice B", "text": "If a concept introduced in the first session of the week appears in the second session without you asking for it, that is the whole point of two practices a week."}, {"title": "Everyone gets time in goal", "text": "Rotate the goalkeeper so every player experiences the position. If someone shows real enthusiasm for it, encourage that too. Positional identity starts forming at this age."}], "prepared": "Preparation at U12 matters more than at any previous age. You have four active focuses and a season arc that builds deliberately. Know which focus is the priority for this week before you arrive. With two practices per week, Practice A introduces the concept and Practice B deepens it. If the group needs more time on the same concept before moving forward, run the consolidation instead. Both are correct responses. Try to avoid pairing two new concepts in the same session: Activity A works best as something players already know well enough to run without much explanation, and Activity B is where the new concept lives.", "parents": {"intro": "Before the session starts, take 30 seconds to walk over. Something like:", "script": "Today we are working on what happens when the ball changes hands, in the first second after we win it or lose it. The most helpful thing you can do is cheer the team moments: the player who sprints to press the second they lose the ball, the player who finds a teammate the instant they win it.", "outro": "At this age players are more aware of what the sideline is saying than they were at U8 or U10. Positive sideline energy is genuinely useful. Critical sideline energy genuinely disrupts."}, "shape": {"title": "The session", "note": "Up to 90 minutes. Arrive 15 minutes early. Opening game, Activity A, Activity B, closing game.", "opening": {"label": "Warm-up game", "minutes": "12 min", "title": "5v5 or 6v6 free small-sided game", "setup": "Same setup every session. Smaller than the closing game, so more touches and cleaner decisions. Small goals or full goals depending on space. Teams of 5 or 6, no goalkeeper. Quick restarts. Let them play the first 8 minutes without saying anything. On Practice B days, watch specifically for whether the concept from Practice A earlier in the week shows up.", "job": "Watch the transition moments specifically. What happens in the first couple of seconds after the ball changes hands? That tells you which focus area to prioritize today. Come in with Activity A already chosen and let the opening game confirm your read.", "question": "When the ball changed hands today, when you won it or lost it, what was your first reaction?", "kit": "1 ball per team · Small or full goals · Disc cones · Pinnies in 2 colors"}, "closing": {"label": "Final game", "minutes": "25 min", "title": "Full game", "setup": "The biggest game of the session. Proper goals if possible. Include a goalkeeper and rotate it so every player experiences the position across the season. No offside until players are genuinely ready for it. Let the game run without stopping. Watch for the focus you introduced that week showing up without being asked for: a compact defensive shape, or a player who sprints to press the instant possession is lost. On Practice B days, notice whether anything from the first session carried over.", "question": "Was there a moment today where your whole team did something together, attacking or defending, that one player could not have done alone?", "kit": "Proper goals if possible · Disc cones · Pinnies in 2 colors"}}, "cues": [{"when": "Team defends compactly", "say": "\"That shape right there, everyone close enough to support each other. That is exactly what we are building toward.\""}, {"when": "Player presses instantly after turnover", "say": "Name it in the moment: \"Did everyone see that? No hesitation, immediate reaction. That is what we are building toward.\""}, {"when": "Player switches the point of attack", "say": "\"That pass across the field: what did it do to the defenders? It made them run. That is the whole idea.\""}, {"when": "Players coaching each other", "say": "Step further back. Let it run. Come back and ask: \"What did you tell your teammate there?\""}, {"when": "Concept from Practice A shows up in Practice B", "say": "\"You did that in the first session this week. Your body remembered. That is exactly what two practices is for.\""}, {"when": "Players too self-critical", "say": "\"The best players in the world make mistakes in every game. The difference is what they do next.\""}]}, "framework": {"age": "u12", "blocks": {"B1": {"tagline": "Same habits, more pressure.", "overview": "Players know the individual skills from U8 and U10. At U12 they deepen them under more pressure, on a bigger field, with more opponents. Scanning, body shape, first touch, passing range and shooting all get tested at a faster speed.", "problem": "Players receive, protect and move the ball under real pressure, with their head up and body open.", "focus": ["Scanning before and during receiving", "First touch away from pressure", "Passing at the right speed and time", "Reading the goalkeeper when shooting"]}, "B2": {"tagline": "Pass, move, and switch the picture.", "overview": "This block goes deeper than U10 as the game gets more complex. Players learn to give the team height, width and depth, to switch the point of attack, to use wall passes in small spaces, and to find the third player.", "problem": "Players use teammates to move the defense: spreading out, switching the ball and combining to find free players.", "focus": ["Height, width and depth", "Switching the point of attack", "Wall passes and third-player runs", "Finding free players between the lines"]}, "B3": {"tagline": "Defend together.", "overview": "Compact team shape and team defending are reinforced and emphasized from U10. One player pressures the ball, one covers behind, and the rest support to cut off space. Defending moves from individual actions to how the team defends.", "problem": "Players defend as a team: pressure, cover and support, with a compact shape and a plan for the far side.", "focus": ["Pressure, cover and support", "Compact shape and distances", "Marking and intercepting", "Recovering and preventing the switch"]}, "B4": {"tagline": "React in the first second.", "overview": "This block is introduced at U12. It covers both transition moments: what we do the instant we lose the ball, and the instant we win it. At this age the aim is the habit of reacting at once, not complex decisions.", "problem": "Players recognize the moment possession changes and react at once, pressing or recovering when it is lost and looking forward when it is won.", "focus": ["Recognizing the turnover instantly", "Immediate pressure or recovery", "First pass forward on winning the ball", "Urgency repeated across the game"]}}}, "skills": [{"id": "u12-b1-scanning-and-body-shape-intro", "age": "u12", "block": "B1", "area": "Scanning and Body Shape", "level": "intro", "tracks": ["rec"], "bullets": ["Scan before the ball arrives and again as pressure closes in", "Open the hips and shoulders toward the attacking goal when receiving", "Keep the head up while dribbling in a busy space"]}, {"id": "u12-b1-controlling-intro", "age": "u12", "block": "B1", "area": "Controlling", "level": "intro", "tracks": ["rec"], "bullets": ["Control passes that arrive in the air, on the bounce or on the turn", "Take the first touch away from the nearest opponent", "Play one touch when the pass is right there"]}, {"id": "u12-b1-protecting-intro", "age": "u12", "block": "B1", "area": "Protecting", "level": "intro", "tracks": ["rec"], "bullets": ["Hold off a closing opponent with the body and the arm out for balance", "Keep the ball on the far foot from the defender", "Release the ball at the right moment"]}, {"id": "u12-b1-driving-and-dribbling-intro", "age": "u12", "block": "B1", "area": "Driving and Dribbling", "level": "intro", "tracks": ["rec"], "bullets": ["Drive into open space at speed", "Accelerate past a defender after a change of direction", "Choose between taking on a defender and passing"]}, {"id": "u12-b1-passing-intro", "age": "u12", "block": "B1", "area": "Passing", "level": "intro", "tracks": ["rec"], "bullets": ["Play the pass at the right speed and at the right time", "Lead a teammate with the pass into space", "Play a longer pass in the air when the field allows"]}, {"id": "u12-b1-shooting-intro", "age": "u12", "block": "B1", "area": "Shooting", "level": "intro", "tracks": ["rec"], "bullets": ["Read the goalkeeper before shooting", "Shoot to the far side from an angle", "Take one touch when an opponent is closing"]}, {"id": "u12-b2-supporting-intro", "age": "u12", "block": "B2", "area": "Supporting", "level": "intro", "tracks": ["rec"], "bullets": ["Create height, width and depth around the ball", "Offer a vertical or diagonal option to the player on the ball", "Move off a teammate so two players are not in the same space"]}, {"id": "u12-b2-switching-and-wall-passes-intro", "age": "u12", "block": "B2", "area": "Switching and Wall Passes", "level": "intro", "tracks": ["rec"], "bullets": ["Switch the ball to the far side when the near side is closed", "Play a wall pass (give and go) in a small space", "Recognize when a teammate on the other side is free"]}, {"id": "u12-b2-combining-in-threes-intro", "age": "u12", "block": "B2", "area": "Combining in Threes", "level": "intro", "tracks": ["rec"], "bullets": ["Find the free player between or behind the opposition", "Make a third-player run when two teammates are combining", "Engage a defender 1v1 or 2v1 to create the space"]}, {"id": "u12-b2-decision-making-intro", "age": "u12", "block": "B2", "area": "Decision-Making", "level": "intro", "tracks": ["rec"], "bullets": ["Choose the quick pass or the dribble based on the pressure", "Talk to teammates with calls that help", "Stay involved in the next play after passing"]}, {"id": "u12-b3-pressure,-cover-and-support-intro", "age": "u12", "block": "B3", "area": "Pressure, Cover and Support", "level": "intro", "tracks": ["rec"], "bullets": ["The nearest player pressures the ball", "The second player covers behind the presser at a distance that lets them step in", "The rest of the team supports to cut off space"]}, {"id": "u12-b3-compact-shape-intro", "age": "u12", "block": "B3", "area": "Compact Shape", "level": "intro", "tracks": ["rec"], "bullets": ["Stay close to teammates so the space between lines is small", "Move together toward the ball side", "Close the middle of the field first"]}, {"id": "u12-b3-marking-and-intercepting-intro", "age": "u12", "block": "B3", "area": "Marking and Intercepting", "level": "intro", "tracks": ["rec"], "bullets": ["Stay between the opponent and the goal", "Mark a specific opponent and deny them the ball in a good position", "Step in to intercept when the pass is on"]}, {"id": "u12-b3-recovery-and-preventing-the-switch-intro", "age": "u12", "block": "B3", "area": "Recovery and Preventing the Switch", "level": "intro", "tracks": ["rec"], "bullets": ["Recover goal-side when pressure is broken", "Cut off the pass to the far side", "Re-apply pressure as soon as the shape is back"]}, {"id": "u12-b4-reacting-when-we-lose-it-intro", "age": "u12", "block": "B4", "area": "Reacting When We Lose It", "level": "intro", "tracks": ["rec"], "bullets": ["React in the first second after losing the ball", "Press at once if teammates are close, delay if they are not", "Sprint back into shape when pressure is broken"]}, {"id": "u12-b4-reacting-when-we-win-it-intro", "age": "u12", "block": "B4", "area": "Reacting When We Win It", "level": "intro", "tracks": ["rec"], "bullets": ["Look up for the first pass forward on winning the ball", "Join the attack with speed", "Play forward when it is on and keep it when it is not"]}, {"id": "u12-b4-urgency-in-the-moment-intro", "age": "u12", "block": "B4", "area": "Urgency in the Moment", "level": "intro", "tracks": ["rec"], "bullets": ["Recognize at once that possession has changed", "Accelerate toward the ball or space", "Keep the intensity through repeated turnovers"]}], "club": {"format": "9v9", "pathway": ["Some players will show real passion and ability this season", "Sierra Gold's competitive program exists to open more doors for those players when they are ready", "Talk to your club director about what that pathway looks like"], "contact": "Got a question about an activity? Want to talk through what you are seeing at training? Not sure how to introduce a new concept to your group? Your Age Group Coordinator and the club Technical Director are there for exactly this. Reach out any time."}, "rules": [{"label": "Format", "text": "9v9", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Ball", "text": "Size 4", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Field", "text": "70 to 80 yards long, 45 to 55 yards wide", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Goals", "text": "Up to 7 feet high, 21 feet wide", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Game time", "text": "2 halves of 30 minutes", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Goalkeeper", "text": "Goalkeeper", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Offside", "text": "Offside applies", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Heading", "tracks": ["rec"], "text": "Not allowed in practice or games, for the whole age group. Rec groups mix two birth years, so one rule has to cover every player. Recreational players start heading at U14.", "source": "Methodology default: rec players start heading at U14, comp players at U12", "origin": "core"}, {"label": "Substitutions", "text": "Unlimited, at any stoppage", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Rosters", "text": "Up to 16 players. A team needs at least 6 to start or continue.", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}, {"label": "Head injuries", "text": "If a head injury is suspected, play stops for evaluation. The player may be substituted. Return requires clearance from a health care professional or certified athletic trainer.", "source": "US Soccer Player Development Initiatives, small-sided games chart", "origin": "core"}], "ladder": ["B1", "B2", "B3", "B4"]}, {"id": "u14-rec", "age": "u14", "track": "rec", "label": "U14", "plan": {"id": "u14-rec", "age": "u14", "track": "rec", "sessions_per_week": 2, "weeks": [{"week": 1, "focus": "Ball skills and combination play on the bigger field", "sessions": [{"a": {"activity": "flying-numbers", "note": "Anchor. Familiar, settles the group into the new format"}, "b": {"activity": "barcelona", "note": "Pass counting. Patience before scoring"}}, {"a": {"activity": "flying-numbers", "note": "Call uneven numbers: 3v2, 4v3"}, "b": {"activity": "barcelona", "note": "Revisit. Can they beat last session's pass count?"}}], "block": "B2", "level": "intro"}, {"week": 2, "focus": "Team defending with more players and more space", "sessions": [{"a": {"activity": "flying-numbers", "note": "Anchor"}, "b": {"activity": "shrinking-field-defending", "note": "Compact shape as space disappears"}}, {"a": {"activity": "shrinking-field-defending", "note": "Revisit. Did defending get easier or harder? Why?"}, "b": {"activity": "barcelona", "note": "Can the team that just defended now keep the ball against pressure?"}}], "block": "B3", "level": "intro"}, {"week": 3, "focus": "Both transition moments revisited", "sessions": [{"a": {"activity": "flying-numbers", "note": "Sprint on, sprint off. No walking"}, "b": {"activity": "crisscross", "note": "Find a target the instant the ball is won"}}, {"a": {"activity": "crisscross", "note": "Revisit. How fast after winning the ball do they find a target?"}, "b": {"activity": "shrinking-field-defending", "note": "Win it, then what? Defend, win, go"}}], "block": "B4", "level": "intro"}, {"week": 4, "focus": "Finishing introduced: the decisive action in front of goal", "sessions": [{"a": {"activity": "flying-numbers", "note": "Anchor. Add a bonus for the first shot after a turnover"}, "b": {"activity": "duels-to-goal", "note": "1v1 to a full-size goal. First decision, first touch, shoot"}}, {"a": {"activity": "duels-to-goal", "note": "Revisit. Reward the early shot and the composed finish"}, "b": {"activity": "waves", "note": "3v2 in waves. When to pass, when to shoot"}}], "block": "B5", "level": "intro"}, {"week": 5, "focus": "Finishing deepens: numbers-up decisions and arriving in the box", "sessions": [{"a": {"activity": "duels-to-goal", "note": "Warm up the finishing with quick duels"}, "b": {"activity": "waves", "note": "Revisit. Celebrate the final pass"}}, {"a": {"activity": "waves", "note": "Revisit with a second defender recovering late"}, "b": {"activity": "wide-service-finishing", "note": "Serve low and hard. Attack near and far post"}}], "block": "B5", "level": "intro"}, {"week": 6, "focus": "Finishing in context: after transition and combination play", "sessions": [{"a": {"activity": "flying-numbers", "note": "Anchor. Finish at speed after sprints"}, "b": {"activity": "wide-service-finishing", "note": "Revisit. Add a defender in the box"}}, {"a": {"activity": "wide-service-finishing", "note": "Revisit. Better timing than last session?"}, "b": {"activity": "crisscross", "note": "Win the ball, find a target, finish"}}], "block": "B5", "level": "intro"}, {"week": 7, "focus": "Integration: all five blocks in play together", "sessions": [{"a": {"activity": "hotbox", "note": "All five blocks in one game. Observe, do not over-coach"}, "b": {"activity": "waves", "note": "Final consolidation of finishing under numbers"}}, {"a": {"activity": "crisscross", "note": "Transition urgency"}, "b": {"activity": "hotbox", "note": "Revisit. What is different from earlier today?"}}], "block": "B5", "level": "intro", "also_blocks": ["B1", "B2", "B3", "B4"]}, {"week": 8, "focus": "Coach's choice both days", "coach_choice": true, "note": "What does your group love most? What do they still need most? Run your two best sessions of the season. Both are correct answers."}]}, "goals": [{"id": "keeps-ball-full-field", "text": "Keeps the ball under pressure on the full field", "blocks": ["B1"]}, {"id": "defends-as-eleven", "text": "Defends as part of an eleven-player team", "blocks": ["B3"]}, {"id": "first-second", "text": "Reacts in the first second after the ball changes hands", "blocks": ["B4"]}, {"id": "shoots-with-composure", "text": "Takes shots with composure and makes good final-third decisions", "blocks": ["B5"]}, {"id": "times-runs", "text": "Times runs to arrive when the ball does", "blocks": ["B2", "B5"]}, {"id": "communicates", "text": "Communicates with and coaches teammates on the field", "blocks": ["B2", "B3"]}, {"id": "wants-to-play", "text": "Shows up wanting to play again", "blocks": ["B1", "B2", "B3", "B4", "B5"]}], "players": {"id": "u14", "age": "u14", "who": [{"label": "Growth is uneven", "text": "In any U14 group you will see players who have already grown a lot and players who have not started. Do not read size as skill. Praise decisions and effort, and watch that your biggest players are not only winning duels with size."}, {"label": "The field got big", "text": "The jump from 9v9 to 11v11 is a jump in distance, not just numbers. Players tire faster and shape breaks down. Short rests and water breaks are coaching tools, not weaknesses."}, {"label": "Peers matter more than you", "text": "At this age what teammates think carries a lot of weight. Individual feedback works best quietly, one on one. Public praise for team moments and brave decisions builds the culture you want."}, {"label": "Some will be ready for more", "text": "A few players in your group may be curious about a more competitive pathway. Notice them, encourage them, and pass it on to your club. Do not promise anything. Just open the door."}], "great_session": [{"title": "Players take the shot", "text": "The ball is in the final third and someone shoots, early, with composure, without a second dribble. Missing is fine. Not shooting is the problem."}, {"title": "Compact, connected shape", "text": "Eleven players on a big field can look scattered. Look for lines that stay close enough to support each other: defenders, midfielders and forwards moving as one unit."}, {"title": "Instant reaction on turnovers", "text": "When the ball changes hands, do players react in the first second or watch? That reaction is the whole game-moments block."}, {"title": "Players talking to each other", "text": "Voices on the field: \"Man on,\" \"Turn,\" \"Switch.\" Player-to-player coaching is a development goal. Step back when it happens."}, {"title": "Practice A concept in Practice B", "text": "If something from the first session of the week shows up in the second without you asking, the concept is taking hold."}, {"title": "Everyone gets a turn in goal", "text": "Rotate the goalkeeper. Finishing practice is also goalkeeper practice, so nobody should miss out on a turn."}], "prepared": "Preparation at U14 is simpler than at U12, because the group already knows the language. Pick the week's focus before you arrive and choose Activity A as something familiar. Activity B is where the new idea lives. If the group needs more time on a concept, run the revisit instead of moving on. With two practices a week, Practice A introduces and Practice B deepens. Both are correct. Try to avoid pairing two new concepts in the same session.", "parents": {"intro": "Before the session starts, take 30 seconds to walk over. Something like:", "script": "This season we are working on finishing and on the moment the ball changes hands. The most helpful thing you can do is cheer the brave decisions: the player who shoots, the player who sprints back, the player who tries the pass that might not work.", "outro": "At U14 players hear everything. Positive sideline energy is genuinely useful. Criticism of a missed shot makes the next shot less likely."}, "shape": {"title": "The session", "note": "Up to 90 minutes. Arrive 15 minutes early. Opening game, Activity A, Activity B, closing game.", "opening": {"label": "Warm-up game", "minutes": "12 min", "title": "6v6 or 7v7 free small-sided game", "setup": "Same setup every session. Smaller than the closing game, so more touches, more shots and cleaner decisions. Half a field, with a full-size or large goal at each end. Teams of 6 or 7. Add a goalkeeper if you have one willing. Quick restarts. Let them play the first 8 minutes without saying anything. On Practice B days, watch for whether the concept from Practice A earlier in the week shows up.", "job": "Watch the moments in front of goal. Do players shoot? Do they pick their moment or force it? Watch the transitions too. Come in with Activity A already chosen and let the opening game confirm your read for Activity B.", "question": "When you had a chance to shoot today, what made you take it or pass it up?", "kit": "1 ball per team · Full-size or large goals · Disc cones · Pinnies in 2 colors"}, "closing": {"label": "Final game", "minutes": "25 min", "title": "Full game", "setup": "The biggest game of the session. Full field, full-size goals, goalkeepers. Play 11v11 if you have the numbers. Short of players? Play 9v9 or 10v10 on a narrower field rather than leaving gaps. Alternatively, put a full-size goal with a keeper at one end and two small goals at the halfway line for the other team to attack. Offside applies, so introduce it early in the season and be patient with it. Let the game run without stopping. Watch for the focus you introduced that week showing up without being asked: a team that stays compact across three lines, a player who sprints to press the instant possession is lost, a forward who shoots when the chance comes.", "question": "Was there a moment today where your whole team did something together, attacking or defending, that one player could not have done alone?", "kit": "Full field · Full-size goals · Disc cones · Pinnies in 2 colors"}}, "cues": [{"when": "Player shoots early and misses", "say": "\"Good decision. Great shot to take. Take that one every time.\" Praise the decision before you talk about the technique."}, {"when": "Player passes up a clear shot", "say": "Ask, do not tell: \"What were you thinking when you had that space?\" Then listen. Often it is confidence, not judgment."}, {"when": "Team defends compactly", "say": "\"That shape right there, everyone close enough to support each other. That is exactly what we are building toward.\""}, {"when": "Player presses instantly after turnover", "say": "Name it in the moment: \"Did everyone see that? No hesitation. That is the whole idea.\""}, {"when": "Players coaching each other", "say": "Step further back. Let it run. Come back and ask: \"What did you tell your teammate there?\""}, {"when": "Players too self-critical", "say": "\"The best players in the world miss shots and lose the ball in every game. The difference is what they do next.\""}]}, "framework": {"age": "u14", "blocks": {"B1": {"tagline": "Prepare the body. Read the picture. Execute with intent.", "overview": "Every player's relationship with the ball comes before everything else. This block establishes the perceptual and technical habits that make all combination play, defending and finishing possible: scanning before the ball arrives, shaping the body to play forward, and using first touch to create a decision rather than just react to pressure. When a player stalls in a later block, look back here first.", "problem": "Players scan, position and make first-touch decisions under high pressure in tight spaces.", "focus": ["Scanning before, during and after receiving", "Body shape and movement to play forward", "Using first touch to create a decision, not just control", "Technique at full game speed and pressure"]}, "B2": {"tagline": "Create advantage. Move the ball forward. Solve pressure together.", "overview": "Combination play only works if the individual technique from the first block is already in place. This block takes that foundation and asks players to solve pressure together: recognizing a teammate's run, providing the right angle of support, and timing the next action so the advantage compounds rather than stalls.", "problem": "Players use teammates to create time, space and numerical advantages, moving the ball forward under pressure through deliberate combination play.", "focus": ["Supporting angle, distance and timing", "Combination play to break defensive lines", "Recognizing and exploiting overloads", "Movement after the pass, not just the pass itself"]}, "B3": {"tagline": "Compact. Coordinated. Aggressive. Defending is not just for defenders.", "overview": "Defending is not just for defenders. Winning the ball back is a collective action: the nearest player pressures, teammates cover behind, and the team stays connected and compact to protect dangerous space. The standard is no longer just reacting to losing the ball. Teams defend proactively, with a compact block that regains possession as high up the field as possible.", "problem": "Players create and maintain a compact defensive block, applying coordinated pressure, cover and balance to prevent forward play and regain the ball.", "focus": ["Coordinated pressure, cover and balance", "Compact shape, vertically and horizontally", "High defensive line and line management", "Immediate reaction after losing the ball"]}, "B4": {"tagline": "Recognizing moments and acting fast.", "overview": "Transitions are the moments that decide games. This block links attacking and defending: the instant possession changes, players must recognize the moment and respond, either with maximum intensity to win the ball back, or with immediate speed to attack before the opponent can organize. A player who reacts fast in transition is applying technique, combination and defensive shape all at once.", "problem": "Players recognize the moment possession changes and respond immediately: pressing or recovering when it is lost, and playing forward at speed or securing the ball when it is won.", "focus": ["Immediate recognition of the transition moment", "Reaction speed and acceleration", "Press or recover, play forward or secure", "Communication and organization under chaos"]}, "B5": {"tagline": "Can we turn advantage into goals?", "overview": "All of the work in the earlier blocks is preparation for this one. Players who scan early, combine well, defend collectively and transition fast create finishing opportunities. This block is about having the composure and technique to take them. When players struggle to finish, the answer is rarely more finishing drills. Check the quality of preparation touches, the timing of runs, and the decisions made before the shot.", "problem": "Players convert advantage into goals under pressure: separating to receive, combining for the final pass, and finishing with composure and limited touches.", "focus": ["Converting advantage into goals through quality final actions", "Separating and unmarking to receive in the box", "Finishing with composure and limited touches", "Managing tempo and stakes as the game state demands"]}}}, "skills": [{"id": "u14-b1-perception-and-preparation-intro", "age": "u14", "block": "B1", "area": "Perception and Preparation", "level": "intro", "tracks": ["rec"], "bullets": ["Scan before receiving to identify pressure and options", "Begin orienting the body to see the field before the ball arrives", "Recognize the obvious difference between time and immediate pressure"]}, {"id": "u14-b1-controlling-intro", "age": "u14", "block": "B1", "area": "Controlling", "level": "intro", "tracks": ["rec"], "bullets": ["Treat first touch as a decision, not just control", "Receive across the body to begin opening up the field", "Use small, controlled touches to set up the next action"]}, {"id": "u14-b1-protecting-intro", "age": "u14", "block": "B1", "area": "Protecting", "level": "intro", "tracks": ["rec"], "bullets": ["Shield and protect the ball when no forward option exists", "Use the body between the ball and the defender", "Hold possession until a forward option opens"]}, {"id": "u14-b1-driving-intro", "age": "u14", "block": "B1", "area": "Driving", "level": "intro", "tracks": ["rec"], "bullets": ["Attack the ball under pressure, move toward it rather than waiting", "Push into open space when it is available", "Begin to play with the head up while moving with the ball"]}, {"id": "u14-b1-dribbling-intro", "age": "u14", "block": "B1", "area": "Dribbling", "level": "intro", "tracks": ["rec"], "bullets": ["Use a first action, touch or feint, to create space", "Begin recognizing obvious 1v1 moments", "Show basic coordination when changing direction with the ball"]}, {"id": "u14-b1-passing-intro", "age": "u14", "block": "B1", "area": "Passing", "level": "intro", "tracks": ["rec"], "bullets": ["Play forward when possible, support when not", "Use one touch when the pass dictates it", "Begin passing accurately with both feet under light pressure"]}, {"id": "u14-b1-decision-making-intro", "age": "u14", "block": "B1", "area": "Decision-Making", "level": "intro", "tracks": ["rec"], "bullets": ["Base the decision on body shape and scan before contact", "Recognize forced one-touch situations versus time to take a touch", "Decisions are deliberate and often reactive at this level"]}, {"id": "u14-b2-perception-and-preparation-intro", "age": "u14", "block": "B2", "area": "Perception and Preparation", "level": "intro", "tracks": ["rec"], "bullets": ["Scan beyond the ball to identify nearby teammates", "Recognize simple support positions: behind, beside and ahead of the ball", "Identify when a teammate is under pressure and needs an outlet"]}, {"id": "u14-b2-supporting-intro", "age": "u14", "block": "B2", "area": "Supporting", "level": "intro", "tracks": ["rec"], "bullets": ["Offer a clear passing option when a teammate has the ball", "Move to avoid standing directly behind a defender", "Reposition after passing rather than watching what happens next"]}, {"id": "u14-b2-technique-for-combination-play-intro", "age": "u14", "block": "B2", "area": "Technique for Combination Play", "level": "intro", "tracks": ["rec"], "bullets": ["Execute basic wall passes at reduced speed", "Use a simple supporting movement after passing", "Adjust passing technique to play to feet rather than space in combination situations"]}, {"id": "u14-b2-passing-and-movement-intro", "age": "u14", "block": "B2", "area": "Passing and Movement", "level": "intro", "tracks": ["rec"], "bullets": ["Pass and then move to a new supporting position rather than watching the pass", "Offer a clear option when a teammate has the ball and understand basic spacing around the ball carrier"]}, {"id": "u14-b2-decision-making-intro", "age": "u14", "block": "B2", "area": "Decision-Making", "level": "intro", "tracks": ["rec"], "bullets": ["Recognize the basic choice between combining with a teammate and carrying forward individually", "Begin choosing between pass-and-move and carry based on where the defender is", "Make simple combination decisions without waiting to be told"]}, {"id": "u14-b3-perception-and-preparation-intro", "age": "u14", "block": "B3", "area": "Perception and Preparation", "level": "intro", "tracks": ["rec"], "bullets": ["React to losing the ball with immediate urgency", "Identify the ball carrier as the first priority", "Recognize nearby teammates as defensive support"]}, {"id": "u14-b3-covering-intro", "age": "u14", "block": "B3", "area": "Covering", "level": "intro", "tracks": ["rec"], "bullets": ["Recognize the importance of helping a teammate who is pressing", "Begin to understand basic cover position behind the ball", "Stay connected to the nearest teammate rather than isolated"]}, {"id": "u14-b3-shape-and-line-management-intro", "age": "u14", "block": "B3", "area": "Shape and Line Management", "level": "intro", "tracks": ["rec"], "bullets": ["Understand that the team defends as a connected group, not individuals", "Begin to recognize when the team is too spread out", "Recover into a basic defensive shape after losing the ball"]}, {"id": "u14-b3-defensive-decision-making-intro", "age": "u14", "block": "B3", "area": "Defensive Decision-Making", "level": "intro", "tracks": ["rec"], "bullets": ["Understand the basic choice between pressing and delaying", "Begin to recover goal-side when beaten", "Recognize the importance of helping teammates defend rather than defending alone"]}, {"id": "u14-b4-perception-and-awareness-intro", "age": "u14", "block": "B4", "area": "Perception and Awareness", "level": "intro", "tracks": ["rec"], "bullets": ["Recognize the moment possession has changed", "Identify the immediate attacking or defensive cue that follows", "Begin scanning during chaotic, fast-moving moments"]}, {"id": "u14-b4-reaction-and-speed-intro", "age": "u14", "block": "B4", "area": "Reaction and Speed", "level": "intro", "tracks": ["rec"], "bullets": ["React quickly after losing or winning the ball", "Accelerate toward the ball or space without hesitation", "Attempt a forward pass after regaining possession when available"]}, {"id": "u14-b4-decision-making-intro", "age": "u14", "block": "B4", "area": "Decision-Making", "level": "intro", "tracks": ["rec"], "bullets": ["Choose between fast attack and holding possession after a regain", "Recognize when the press has failed and the team must recover", "Support teammates in transition rather than acting alone"]}, {"id": "u14-b5-recognizing-the-moment-intro", "age": "u14", "block": "B5", "area": "Recognizing the Moment", "level": "intro", "tracks": ["rec"], "bullets": ["Identify when in shooting or final-pass range", "Notice goal location and basic pressure", "Recognize simple scoring opportunities"]}, {"id": "u14-b5-preparation-and-body-shape-intro", "age": "u14", "block": "B5", "area": "Preparation and Body Shape", "level": "intro", "tracks": ["rec"], "bullets": ["Set the body to face goal when receiving near the box", "Use a settling touch to prepare for a shot or pass", "Show basic balance before striking the ball"]}, {"id": "u14-b5-executing-final-actions-intro", "age": "u14", "block": "B5", "area": "Executing Final Actions", "level": "intro", "tracks": ["rec"], "bullets": ["Use inside foot or simple laces technique to finish", "Complete uncontested headers or rebounds", "Execute basic cutbacks or square passes"]}, {"id": "u14-b5-composure-and-ownership-intro", "age": "u14", "block": "B5", "area": "Composure and Ownership", "level": "intro", "tracks": ["rec"], "bullets": ["Willing to shoot or play the final pass", "Accept missed chances without frustration", "Reset quickly after attempts"]}], "club": {"format": "11v11", "rules": [{"label": "Format", "text": "11v11 on a full-size field, roughly 100 to 120 yards long and 50 to 80 yards wide. Size 5 ball. Goals are 8 feet by 24 feet.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Heading", "text": "Deliberate heading is allowed in games at 11v11. Build up to it gradually in training and keep the number of headers low.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Offside", "text": "Offside applies. Teach it early. Club linesmen cannot call offside, so with one referee the referee makes that call.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Build-out line", "text": "None at 11v11. The build-out line used at 7v7 and 9v9 goes away. Goalkeepers and defenders now play out of the back under real pressure.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Substitutions", "text": "Unlimited, at any stoppage with the referee's permission. Substitutes wait at the halfway line until the referee waves them on.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Rosters", "text": "Up to 18 on a game-day roster. A team needs at least 7 players to play.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Free kicks and penalties", "text": "Opponents stand 10 yards back on free kicks. Penalty kicks are taken from 12 yards.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Officials", "text": "Three referees where possible. One referee with two club linesmen is allowed when licensed officials are short.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}, {"label": "Head injuries", "text": "A player removed for a suspected head injury cannot return that day and needs clearance from a licensed healthcare provider before playing again.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13"}], "pathway": ["Some players will show real passion and ability this season", "Sierra Gold's competitive program exists to open more doors for those players when they are ready", "Talk to your club director about what that pathway looks like"], "contact": "Got a question about an activity? Want to talk through what you are seeing at training? Not sure how to introduce finishing to your group? Your Age Group Coordinator and the club Technical Director are there for exactly this. Reach out any time."}, "rules": [{"label": "Format", "text": "11v11 on a full-size field, roughly 100 to 120 yards long and 50 to 80 yards wide. Size 5 ball. Goals are 8 feet by 24 feet.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Ball", "text": "Size 5", "source": "Laws of the Game", "origin": "core"}, {"label": "Offside", "text": "Offside applies. Teach it early. Club linesmen cannot call offside, so with one referee the referee makes that call.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Heading", "text": "Deliberate heading is allowed in games at 11v11. Build up to it gradually in training and keep the number of headers low.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Head injuries", "text": "A player removed for a suspected head injury cannot return that day and needs clearance from a licensed healthcare provider before playing again.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Build-out line", "text": "None at 11v11. The build-out line used at 7v7 and 9v9 goes away. Goalkeepers and defenders now play out of the back under real pressure.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Substitutions", "text": "Unlimited, at any stoppage with the referee's permission. Substitutes wait at the halfway line until the referee waves them on.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Rosters", "text": "Up to 18 on a game-day roster. A team needs at least 7 players to play.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Free kicks and penalties", "text": "Opponents stand 10 yards back on free kicks. Penalty kicks are taken from 12 yards.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}, {"label": "Officials", "text": "Three referees where possible. One referee with two club linesmen is allowed when licensed officials are short.", "source": "NorCal 2025-2026 Handbook, sections 5.3, 5.4, 5.12, 5.13", "origin": "club"}], "ladder": ["B1", "B2", "B3", "B4", "B5"]}], "blocks": {"B1": {"name": "Me & the Ball", "group_label": "Individual skill, pressure, scanning, body shape", "css": ""}, "B2": {"name": "Me & My Teammates", "group_label": "Passing, combination play, creating and using space", "css": ""}, "B3": {"name": "Me & My Team Defending", "group_label": "Pressing, delaying, covering, marking, staying compact", "css": "defending"}, "B4": {"name": "Me & the Game", "group_label": "Both transitions: the moment we lose it and the moment we win it", "css": ""}, "B5": {"name": "Me & the Moment", "group_label": "Finishing, composure, game management", "css": ""}, "D": {"name": "Discovery", "group_label": "Movement, ball comfort and joy", "css": ""}}, "ladder": {"rec": {"u6": ["D", "B1"], "u8": ["B1", "B2"], "u10": ["B1", "B2", "B3"], "u12": ["B1", "B2", "B3", "B4"], "u14": ["B1", "B2", "B3", "B4", "B5"]}, "comp": {"u10": ["B1", "B2", "B3"], "u12": ["B1", "B2", "B3", "B4", "B5"], "u14": ["B1", "B2", "B3", "B4", "B5"]}, "levels": {"rec": ["intro"], "comp": ["intro", "dev", "app"]}}};
const KEY = 'coachplanner.v1';
const SPACE = {quarter: 1, half: 2, full: 3};
const SPACE_LABEL = {quarter: '1/4 field', half: '1/2 field', full: 'Full field'};
let state = load();
if(state.space && !SPACE[state.space]) state.space = 'half';
let route = '';
try { route = location.hash.slice(1); } catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = s => document.querySelector(s), app = $('#app');
const acts = Object.fromEntries(DATA.activities.map(a => [a.id, a]));
if(state.players && !state.team) state.team = 'u10-rec';
const teamOf = id => DATA.teams.find(t => t.id === id) || DATA.teams[0];
let T = teamOf(state.team), plan = T.plan;
function setTeam(id){ T = teamOf(id); plan = T.plan; state.team = T.id; }
const A = id => { const a = acts[id], o = (a.for_age || {})[T.age]; return o ? Object.assign({}, a, o) : a; };
function actName(ref){ const [b, v] = ref.split('#'); const a = acts[b]; if(!v) return a.name; return (a.variants||[]).find(x => x.id === v).name; }
const slotsOf = (w, si) => ['a','b'].filter(k => w.sessions[si][k]);
function slotRef(w, si, slot){ const k = `${w.week}-${si}-${slot}`; return (state.swaps||{})[k] || w.sessions[si][slot].activity; }
function fits(a){ return (!state.players || (a.players.min <= state.players && state.players <= a.players.max)) && (!state.space || SPACE[a.space] <= SPACE[state.space]); }
function alternatives(w, si, slot){
  const slots = slotsOf(w, si), cur = slotRef(w, si, slot).split('#')[0], others = slots.filter(k => k !== slot).map(k => slotRef(w, si, k).split('#')[0]);

const DAY = 864e5, iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }, parse = t => { const [y,m,d] = t.split('-').map(Number); return new Date(y, m-1, d); };

function finishTour(to){ state.onb = {team: T.id, start: state.start || null}; save(); go(to || 'now'); }
const chunk = (arr, k) => { const o = []; for(let i = 0; i < arr.length; i += k) o.push(arr.slice(i, i + k)); return o; };
function tourSteps(){

function gameCard(g){ return `<div class="card game"><b>${g.label}</b> <span class="note">${g.minutes}</span><div class="nm">${g.title}</div>
  <details><summary>How to run it</summary><div class="lbl">Setup</div>${g.setup}${g.job ? `<div class="lbl">Your job</div>${g.job}` : ''}<div class="lbl">Ask</div>&ldquo;${g.question}&rdquo;<div class="lbl">Equipment</div>${g.kit}</details></div>`; }

async function shareWeek(n, btn){

function viewWeek(n){
