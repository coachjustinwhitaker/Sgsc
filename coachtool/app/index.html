<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{brand.short_name}} Coach Planner</title>
<style>
:root{--navy:{{brand.navy}};--navy-dark:{{brand.navy_dark}};--gold:{{brand.gold}};--ink:#222;--mute:#6b7280;--line:#e3e7ee;--bg:#f6f7fa}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy-dark);color:#fff;padding:12px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header img{height:34px}header b{font-size:15px}header small{display:block;opacity:.7;font-size:12px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:17px;margin:20px 0 8px}p.lead{color:var(--mute);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:12px 0 4px}select,input[type=number]{width:100%;padding:10px;font-size:16px;border:1px solid #c9d0db;border-radius:8px;background:#fff}
button,.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:14px;text-align:center;text-decoration:none;display:block}
button.ghost,.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.small{width:auto;padding:7px 12px;font-size:14px;margin:0}
.goal{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.goal:first-child{border-top:0}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:#e8eef8;border-radius:999px;padding:2px 8px;margin-right:4px}
.wk{display:block;color:inherit;text-decoration:none}.wk b{color:var(--navy)}.wk .f{font-size:14px;color:var(--mute)}
.slot{border-top:1px solid var(--line);padding:12px 0}.slot:first-child{border-top:0}.slot .lab{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.slot .nm{font-size:18px;font-weight:700;color:var(--navy)}.slot .note{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;color:var(--navy);font-weight:600;margin-top:8px}
.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.alt span{font-size:15px}
.dg{width:100%;height:auto;border-radius:8px;margin-top:10px}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;margin-top:10px}
.tag{text-decoration:none}
.back{display:inline-block;margin:4px 0 8px;color:var(--navy);text-decoration:none;font-weight:600}
nav.tabs{display:flex;gap:6px;margin:6px 0 12px}nav.tabs a{flex:1;text-align:center;padding:8px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--navy);text-decoration:none;font-size:14px;font-weight:600}nav.tabs a.on{background:var(--navy);color:#fff}
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}.strip a{color:var(--navy);text-decoration:none;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.strip a.off{opacity:.3;pointer-events:none}.strip span{font-size:13px;color:var(--mute);text-align:center}
.dots{display:flex;gap:5px;margin:4px 0 10px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--gold)}
.skip{display:block;text-align:center;color:var(--mute);font-size:14px;margin-top:14px}.banner{background:#fff8e6;border:1px solid #f0dca0;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.rule .src{font-size:12px;color:var(--mute)}.rule .club{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase}
.row{display:block;color:inherit;text-decoration:none}.row b{color:var(--navy)}
@media print{header,nav.tabs,.strip a,.noprint,button,summary{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{break-inside:avoid;border-color:#bbb}details>*{display:block}}
.share{display:flex;gap:8px;margin:14px 0}.share button{margin:0;flex:1}
.reset{color:var(--mute);font-size:13px;text-align:center;margin:24px 0}
</style></head><body>
<header><img src="{{brand.logo_src}}" alt=""><div><b>Coach Planner</b><small>{{brand.short_name}} · prototype</small></div></header>
<main id="app"></main>
<script>
const DATA = /*DATA*/;
const KEY = 'coachplanner.v1';
const SPACE = {quarter: 1, half: 2, full: 3};
const SPACE_LABEL = {quarter: '1/4 field', half: '1/2 field', full: 'Full field'};
let state = load();
if(state.space && !SPACE[state.space]) state.space = 'half';
let route = '';
try { route = location.hash.slice(1); } catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const $ = s => document.querySelector(s), app = $('#app');
const acts = Object.fromEntries(DATA.activities.map(a => [a.id, a]));
if(state.players && !state.team) state.team = 'u10-rec';
const teamOf = id => DATA.teams.find(t => t.id === id) || DATA.teams[0];
let T = teamOf(state.team), plan = T.plan;
function setTeam(id){ T = teamOf(id); plan = T.plan; state.team = T.id; }
const A = id => { const a = acts[id], o = (a.for_age || {})[T.age]; return o ? Object.assign({}, a, o) : a; };
function actName(ref){ const [b, v] = ref.split('#'); const a = acts[b]; if(!v) return a.name; return (a.variants||[]).find(x => x.id === v).name; }
const slotsOf = (w, si) => ['a','b'].filter(k => w.sessions[si][k]);
function slotRef(w, si, slot){ const k = `${w.week}-${si}-${slot}`; return (state.swaps||{})[k] || w.sessions[si][slot].activity; }
function fits(a){ return (!state.players || (a.players.min <= state.players && state.players <= a.players.max)) && (!state.space || SPACE[a.space] <= SPACE[state.space]); }
function alternatives(w, si, slot){
  const slots = slotsOf(w, si), cur = slotRef(w, si, slot).split('#')[0], others = slots.filter(k => k !== slot).map(k => slotRef(w, si, k).split('#')[0]);
  const ok = T.ladder, same = [w.block].concat(w.also_blocks || []), anchor = slots.length > 1 && slot === 'a';
  return DATA.activities.filter(a => a.ages.includes(T.age) && a.tracks.includes(T.track) && a.id !== cur && !others.includes(a.id) && fits(a) && (anchor ? (ok.indexOf(a.block) <= ok.indexOf(w.block) || same.includes(a.block)) : same.includes(a.block)));
}
const DAY = 864e5, iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); }, parse = t => { const [y,m,d] = t.split('-').map(Number); return new Date(y, m-1, d); };
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const nice = t => parse(t).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
function curWeek(){ const N = plan.weeks.length; if(!state.start) return Math.min(state.week || 1, N); return Math.max(1, Math.min(N, Math.floor((todayD() - parse(state.start)) / (7*DAY)) + 1)); }
function needTour(){ const o = state.onb; if(!o || o.team !== T.id) return true; return !state.start || !o.start || Math.abs(parse(state.start) - parse(o.start)) > 90*DAY; }
function go(h){ route = h; try { history.replaceState(null, '', '#' + h); } catch(e){} render(); }
document.addEventListener('click', e => { const a = e.target.closest('[data-nav]'); if(a){ e.preventDefault(); go(a.dataset.nav); } });
function tabs(on){ return `<nav class="tabs">${[['now','This week'],['plan','Season'],['guide','Guide'],['goals','Goals'],['setup','Setup']].map(([h,l]) => `<a href="#" data-nav="${h}" class="${on===h?'on':''}">${l}</a>`).join('')}</nav>`; }
function viewSetup(){
  const first = !state.players;
  app.innerHTML = (first ? '' : tabs('setup')) + `<h1>Set up your team</h1><p class="lead">${first ? 'A few quick questions, then a short tour of your age group.' : 'Change any of this at any time.'}</p>
  <div class="card"><label>Age group</label><select id="ag">${DATA.teams.map(t => `<option value="${t.id}" ${T.id===t.id?'selected':''}>${t.label}</option>`).join('')}</select>
  <label>Players at a typical practice</label><input id="pl" type="number" min="4" max="24" value="${state.players||12}">
  <label>Space you usually have for a session</label><select id="sp">${Object.keys(SPACE_LABEL).map(k => `<option value="${k}" ${(state.space||'half')===k?'selected':''}>${SPACE_LABEL[k]}</option>`).join('')}</select>
  <label>First week of your season</label><input id="st" type="date" value="${state.start || iso(todayD())}"><p class="note" style="margin:6px 0 0">The app opens on the week you are in. Not sure yet? Leave it as today.</p>
  <button id="ok">${first ? 'Next: your players' : 'Save'}</button></div>
  <p class="reset"><a href="#" id="rs">Start over</a></p>`;
  $('#ok').onclick = () => { if($('#ag').value !== T.id){ state.swaps = {}; setTeam($('#ag').value); } state.players = +$('#pl').value; state.space = $('#sp').value; state.start = $('#st').value || iso(todayD()); save(); go(needTour() ? 'onb/1' : 'now'); };
  $('#rs').onclick = e => { e.preventDefault(); state = {}; save(); setTeam(DATA.teams[0].id); go('setup'); };
}
const SECTIONS = () => { const P = T.players, sh = P.shape, out = [
  ['who', 'Who is in front of you', `Understanding your ${T.label} players${T.club.format ? ' · ' + T.club.format : ''}.`, () => `<div class="card">${P.who.map(x => `<p><b>${x.label}</b><br>${x.text}</p>`).join('')}</div>`],
  ['great', 'What a great session looks like', 'What to watch for, whatever the score.', () => `<div class="card">${P.great_session.map(x => `<p><b>${x.title}</b><br>${x.text}</p>`).join('')}</div>`],
  ['organized', 'How a session is organized', 'The shape, and how to get ready.', () => (sh ? `<p class="note">${sh.note}</p>${gameCard(sh.opening)}<div class="card"><b>The middle</b><div class="nm">${plan.sessions_per_week === 1 ? 'The practice activity' : 'Activity A and Activity B'}</div><p class="note">${plan.sessions_per_week === 1 ? 'One activity carries the week.' : 'A is familiar and physical. B carries the week\'s idea.'}</p></div>${gameCard(sh.closing)}` : '') + `<h2>Before you arrive</h2><div class="card"><p>${P.prepared}</p></div>`]];
  if(T.rules && T.rules.length) out.push(['rules', 'Game rules at this age', 'What to know before the first game. If a referee or your league says otherwise, they win.', () => `<div class="card">${T.rules.map(r => `<p class="rule"><b>${r.label}</b>${r.origin === 'club' ? ' <span class="club">Local</span>' : ''}<br>${r.text}${r.source ? `<br><span class="src">${r.source}</span>` : ''}</p>`).join('')}</div>`]);
  out.push(['parents', 'The parents on the sideline', 'A 30 second talk before the first session.', () => `<div class="card"><p>${P.parents.intro}</p><p><i>&ldquo;${P.parents.script}&rdquo;</i></p><p>${P.parents.outro}</p></div>`]);
  if(P.cues) out.push(['cues', 'Coaching cues', 'What to say in the moment.', () => `<div class="card">${P.cues.map(c => `<p><b>${c.when}</b><br>${c.say}</p>`).join('')}</div>`]);
  if(T.club.pathway || T.club.contact) out.push(['club', 'A player ready for more', 'And who to ask.', () => (T.club.pathway ? `<div class="card"><ul>${T.club.pathway.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '') + (T.club.contact ? `<h2>Questions?</h2><div class="card"><p>${T.club.contact}</p></div>` : '')]);
  return out; };
function viewGuide(key){
  const S = SECTIONS();
  if(!key){ app.innerHTML = tabs('guide') + `<h1>Coach guide</h1><p class="lead">Everything from the first-time tour, whenever you want it.</p>` + S.map(([k, t, sub]) => `<a class="card row" href="#" data-nav="guide/${k}"><b>${t}</b><div class="note">${sub}</div></a>`).join('') + `<button class="ghost" data-nav="onb/1">Replay the tour</button>`; return; }
  const sec = S.find(x => x[0] === key); if(!sec) return viewGuide();
  app.innerHTML = `<a class="back" href="#" data-nav="guide">&larr; Guide</a><h1>${sec[1]}</h1><p class="lead">${sec[2]}</p>` + sec[3]();
}
function finishTour(to){ state.onb = {team: T.id, start: state.start || null}; save(); go(to || 'now'); }
function viewTour(n){
  const S = SECTIONS(), steps = S.filter(x => ['who','great','organized','rules'].includes(x[0])).map(x => ({title: x[1], sub: x[2], html: x[3]})).concat([{title: 'Player goals', sub: `By the end of the season, a ${T.label} should be showing these.`, html: goalsHtml}, {title: 'Your season', sub: `${plan.weeks.length} weeks, ${plan.sessions_per_week === 1 ? 'one practice' : 'two practices'} a week. Each week has one focus.`, html: seasonHtml}]);
  const last = steps.length, i = Math.max(1, Math.min(last, n)), st = steps[i-1];
  app.innerHTML = `<div class="dots">${steps.map((_, k) => `<i class="${k < i ? 'on' : ''}"></i>`).join('')}</div><p class="note" style="margin:0">Step ${i} of ${last}</p><h1>${st.title}</h1><p class="lead">${st.sub}</p>${st.html()}
    <button id="nx">${i === last ? 'Start with this week' : 'Next'}</button>${i > 1 ? `<button class="ghost" data-nav="onb/${i-1}">Back</button>` : ''}<a class="skip" href="#" id="sk">Skip the tour. It is all in the Guide.</a>`;
  $('#nx').onclick = () => i === last ? finishTour('now') : go('onb/' + (i+1));
  $('#sk').onclick = e => { e.preventDefault(); finishTour('now'); };
}
const goalsHtml = () => `<div class="card">${T.goals.map(g => `<div class="goal"><span>${g.text}<br>${g.blocks.map(b => `<a href="#" data-nav="why/${b}" class="tag">${DATA.blocks[b].name}</a>`).join('')}</span></div>`).join('')}</div>`;
const seasonHtml = () => plan.weeks.map(w => `<div class="card"><b>Week ${w.week}</b><div class="note">${w.focus}</div></div>`).join('');
function viewGoals(){
  app.innerHTML = tabs('goals') + `<h1>Player goals</h1><p class="lead">By the end of the season, a ${T.label} should be showing these. Tap a block to see why it matters. The plan builds toward them.</p>` + goalsHtml();
}
function viewPlan(){
  const n = plan.sessions_per_week, cw = curWeek();
  app.innerHTML = tabs('plan') + `<h1>Your season</h1><p class="lead">${plan.weeks.length} weeks, ${n === 1 ? 'one practice' : 'two practices'} a week. Tap a week to see the session${n === 1 ? '' : 's'}.</p>` + plan.weeks.map(w => `<a class="card wk" href="#" data-nav="week/${w.week}"><b>Week ${w.week}${w.week === cw ? ' · this week' : ''}</b><div class="f">${w.focus}</div></a>`).join('');
}
function gameCard(g){ return `<div class="card"><b>${g.label}</b> <span class="note">${g.minutes}</span><div class="nm">${g.title}</div>
  <details><summary>How to run it</summary><div class="lbl">Setup</div>${g.setup}${g.job ? `<div class="lbl">Your job</div>${g.job}` : ''}<div class="lbl">Ask</div>&ldquo;${g.question}&rdquo;<div class="lbl">Equipment</div>${g.kit}</details></div>`; }
function weekText(n){
  const w = plan.weeks.find(x => x.week === n), shape = T.players.shape, L = [`${T.label} · Week ${n} of ${plan.weeks.length}`, w.focus, ''];
  if(w.coach_choice){ L.push(w.note); return L.join('\n'); }
  const one = plan.sessions_per_week === 1;
  if(shape){ const g = shape.opening; L.push(`${g.label} (${g.minutes}): ${g.title}`, g.setup, ''); }
  w.sessions.forEach((ses, si) => { L.push(one ? 'Practice' : 'Practice ' + (si ? 'B' : 'A'));
    slotsOf(w, si).forEach(slot => { const ref = slotRef(w, si, slot), a = A(ref.split('#')[0]); L.push(`- ${actName(ref)}: ${a.setup}`, `  Look for: ${a.look_for}`, `  Ask: "${a.question}"`, `  Equipment: ${a.equipment}`); }); L.push(''); });
  if(shape){ const g = shape.closing; L.push(`${g.label} (${g.minutes}): ${g.title}`, g.setup); }
  return L.join('\n').trim();
}
async function shareWeek(n, btn){
  const text = weekText(n), title = `${T.label} week ${n}`;
  try { if(navigator.share){ await navigator.share({title, text}); return; } } catch(e){ if(e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied. Paste it anywhere.'; }
  catch(e){ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); btn.textContent = 'Copied. Paste it anywhere.'; } catch(x){ btn.textContent = 'Could not copy'; } t.remove(); }
}
function printWeek(){ const ds = [...document.querySelectorAll('details')], was = ds.map(d => d.open); ds.forEach(d => d.open = true); window.print(); ds.forEach((d, i) => d.open = was[i]); }
function viewWeek(n){
  const w = plan.weeks.find(x => x.week === n), shape = T.players.shape, N = plan.weeks.length, cw = curWeek(), P = T.players;
  if(!state.start){ state.week = n; save(); }
  let bn = '';
  if(state.start){ const sd = parse(state.start), ed = new Date(sd.getTime() + N*7*DAY); if(todayD() < sd) bn = `<div class="banner">Your season starts ${nice(state.start)}. Here is week 1.</div>`; else if(todayD() >= ed) bn = `<div class="banner">Your ${N} weeks are done. Here is the last week. Start a new season in Setup.</div>`; }
  const strip = `<div class="strip"><a href="#" data-nav="week/${n-1}" class="${n <= 1 ? 'off' : ''}">&larr;</a><span><b>Week ${n} of ${N}</b>${n === cw ? ' · this week' : ''}<br><a href="#" data-nav="plan" style="border:0;padding:0;background:none;font-weight:600">Whole season</a></span><a href="#" data-nav="week/${n+1}" class="${n >= N ? 'off' : ''}">&rarr;</a></div>`;
  const on = n === cw ? 'now' : 'plan';
  if(w.coach_choice){ app.innerHTML = tabs(on) + strip + bn + `<h1>Week ${w.week}</h1><div class="card"><b>${w.focus}</b><p>${w.note}</p></div>`; return; }
  const one = plan.sessions_per_week === 1;
  const sessions = w.sessions.map((ses, si) => `<div class="card"><b>${one ? 'Practice' : 'Practice ' + (si ? 'B' : 'A')}</b>` + slotsOf(w, si).map(slot => {
    const ref = slotRef(w, si, slot), a = A(ref.split('#')[0]), note = w.sessions[si][slot].note, multi = slotsOf(w, si).length > 1;
    const swapped = (state.swaps||{})[`${w.week}-${si}-${slot}`];
    const alts = alternatives(w, si, slot);
    return `<div class="slot"><div class="lab">${(plan.slot_labels && plan.slot_labels[slot]) || (multi ? 'Activity ' + slot.toUpperCase() + (slot==='a' ? ' · anchor' : ' · focus') : 'Practice activity')}</div><div class="nm">${actName(ref)}</div>
      <div class="note">${swapped ? 'Swapped in' : note}</div>
      <details><summary>How to run it</summary>${a.diagram_src ? `<img class="dg" src="${a.diagram_src}" alt="${a.name} diagram">` : ''}<div class="lbl">Setup</div>${a.setup}<div class="lbl">What to look for</div>${a.look_for}<div class="lbl">Ask</div>&ldquo;${a.question}&rdquo;<div class="lbl">Equipment</div>${a.equipment}${a.source ? `<div class="lbl">Source</div>${a.source}` : ''}</details>
      <details><summary>Swap (${alts.length} fit your numbers and space)</summary>${alts.map(x => `<div class="alt"><span>${x.name}</span><button class="small" data-k="${w.week}-${si}-${slot}" data-id="${x.id}">Use</button></div>`).join('') || '<p class="note">Nothing else fits. Try a different space in Setup.</p>'}
      ${swapped ? `<button class="small ghost" data-k="${w.week}-${si}-${slot}" data-id="">Put the original back</button>` : ''}</details></div>`;
  }).join('') + '</div>').join('');
  const gs = P.great_session[(n-1) % P.great_session.length], cue = P.cues && P.cues[(n-1) % P.cues.length];
  const bits = `<h2>This week, watch for</h2><div class="card"><p><b>${gs.title}</b><br>${gs.text}</p>${cue ? `<p><b>${cue.when}</b><br>${cue.say}</p>` : ''}${n === 1 ? `<p><a href="#" data-nav="guide/parents">Before the first session: a word for parents</a></p>` : ''}<p class="note"><a href="#" data-nav="why/${w.block}">Why this block: ${DATA.blocks[w.block].name}</a> · <a href="#" data-nav="guide">Coach guide</a></p></div>`;
  app.innerHTML = tabs(on) + strip + bn + `<h1>${w.focus}</h1>` + (shape ? gameCard(shape.opening) : '') + sessions + (shape ? gameCard(shape.closing) : '') + bits + `<div class="share noprint"><button id="shr">Share this week</button><button class="ghost" id="prt">Print</button></div>`;
  $('#shr').onclick = () => shareWeek(n, $('#shr')); $('#prt').onclick = printWeek;
  app.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { state.swaps = state.swaps || {}; if(b.dataset.id) state.swaps[b.dataset.k] = b.dataset.id; else delete state.swaps[b.dataset.k]; save(); viewWeek(n); });
}
function viewWhy(b){
  const f = T.framework.blocks[b], areas = T.skills.filter(r => r.block === b && r.level === 'intro'), list = DATA.activities.filter(a => a.ages.includes(T.age) && a.tracks.includes(T.track) && a.block === b);
  app.innerHTML = `<a class="back" href="#" data-nav="goals">&larr; Goals</a><h1>${DATA.blocks[b].name}</h1><p class="lead"><i>${f.tagline}</i></p>
  <div class="card"><p>${f.overview}</p><div class="lbl">The game problem</div><p>${f.problem}</p><div class="lbl">Core focus</div><ul>${f.focus.map(x => `<li>${x}</li>`).join('')}</ul></div>
  <h2>What to look for</h2>${areas.map(r => `<div class="card"><b>${r.area}</b><ul>${r.bullets.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}
  <h2>Activities that build it</h2><div class="card">${list.map(a => `<div class="alt"><span><b>${a.name}</b><br><span class="note">${a.skills.join(' · ')}</span></span></div>`).join('') || '<p class="note">None yet.</p>'}</div>`;
}
function render(){
