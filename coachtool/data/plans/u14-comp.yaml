why_periodize:
- title: Plan, do not react
  text: Training follows a developmental plan, not the last scoreline. Drilling transitions after a loss
    treats a symptom. A planned season builds skills that compound, and the plan holds after a bad game.
- title: The season is a spiral
  text: Ideas are introduced, set down while other work happens, then come back at greater depth. Players
    move from Introduction to Development to Application. At U13, specialization begins at Application.
- title: Weekly themes are a lens
  text: Each week has a focus idea that gives players something to hold onto. It is a lens on the same
    work, not a separate curriculum.
- title: Players read the plan too
  text: A plan that does not swing with each result builds confidence in the process. Constant reaction
    tells players things are unstable.
- title: Hold the plan by default
  text: Change it when it is clearly the right call, not because of one game.
