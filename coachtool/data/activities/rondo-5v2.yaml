setup: Square of cones. Five attackers in a circle, two defenders in the center. Attackers keep the ball
  away. Track consecutive passes. Attacker who last touched an interception or ball out of bounds swaps
  with a defender. Rotate defenders every few minutes. Limit to 1–2 touches for extra challenge.
look_for: 'Where the Rondo (4v1) is a small tight game, this is the bigger version: more players, two
  defenders, faster decisions required. Quick touches and spreading the space are the two things to reinforce.
  Encourage attackers to draw a defender toward them before passing. The moment a defender commits, there
  is a free player somewhere. That read is the whole game.'
question: How did you draw the defender in before passing? What would have happened if you passed straight
  away?
