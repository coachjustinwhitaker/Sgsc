setup: Grid about 25 by 20 yards with small cone triangles scattered throughout, about one triangle per
  player. Every player has a ball. Players score by dribbling through a triangle with the ball within
  arm's reach of their body. Players count their own score out loud and shout it each time they hit a
  triangle. The group goal is 101 combined. Your job is to roam the grid and knock balls away, going after
  your stronger players first.
look_for: Players using small touches to keep the ball close when you approach. Heads up to spot both
  the triangles and you coming. The counting keeps players invested in the team total.
question: How did you keep the ball safe when I came near you?
