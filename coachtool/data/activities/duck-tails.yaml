setup: 'Grid about 20 by 20 yards. Every player has a ball and tucks a pinny in the back of their shorts.
  Players dribble around the space trying to steal a teammate''s tail while protecting their own. Start
  with no elimination: if a tail falls off, tuck it back in and keep playing. For a final competitive
  round, switch to elimination: tail stolen means you are out. Last player with their tail wins. Count
  how many tails each player collects.'
look_for: Players who face their opponent rather than just running away. That is the beginning of how
  they will take on a defender. Heads up to see where tails are and where opponents are coming from.
question: What did you do when someone came to steal your tail?
