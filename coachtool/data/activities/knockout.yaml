setup: 'Grid about 20 by 20 yards. Every player has a ball and dribbles freely. Players try to knock other
  players'' balls out of the grid while keeping their own in. Ball knocked out: five toe taps outside
  the grid, then back in (non-elimination). For a final competitive round, switch to elimination: ball
  knocked out means you are out. Last player with their ball in the grid wins. Remind players to keep
  their ball close when an opponent approaches.'
look_for: Players who shield the ball with their body rather than just running away. Players who look
  up to track both the ball and the incoming threat.
question: When someone came to knock your ball out, what did you do to protect it?
