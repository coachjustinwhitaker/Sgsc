setup: 'Grid about 25 by 20 yards. Every player has a ball. Green light: dribble fast. Yellow light: slow
  down with small touches to keep the ball close. Red light: stop with one foot on the ball. Call lights
  at random as players move around the grid. After a minute, ask players to suggest a new color and give
  it a new action (orange means swing your arms, purple means dance) and repeat each new color a few times.'
look_for: Players keeping the ball within arm's reach at yellow. Heads up to avoid collisions. On red
  light, emphasize using the sole of the foot to stop rather than letting the ball roll away.
question: When I called yellow, what did you have to do with your feet to keep the ball close?
