setup: 'Square grid, one defender in the center, four attackers on the outside. This is called a rondo.
  Attackers keep the ball away from the defender. When the defender wins it or the ball goes out, the
  attacker who last touched it swaps into the middle. Keep track of consecutive passes. Progress: add
  a second defender (4v2) if passing is excellent, or drop to 3v1 to force attackers to move more.'
look_for: Look for attackers spreading out to give the player with the ball multiple options. Players
  who bunch together make the defender's job easy. The player with the ball should always have at least
  two teammates they can see. On the receiving end, open hips give a player more time before the defender
  closes in.
question: When you were in the middle defending, what made it harder to win the ball? What made it easier?
