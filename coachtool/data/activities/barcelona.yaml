setup: 'Rectangular grid with goals at each end. 3v3 or 4v4, no goalkeeper. Score points equal to the
  number of passes completed before scoring: 8 passes before a goal = 8 points. A missed shot scores nothing.
  Play short rounds of 3–4 minutes.'
look_for: Teams that learn to move the ball patiently before shooting will outscore teams that rush. Watch
  for players who switch the ball to the far side before going to goal. That is combination play at its
  most sophisticated. Best as a focus activity late in the season when passing habits are forming.
question: Before you scored, was there a moment where you switched the ball to the other side? What did
  that open up?
