setup: Rectangular grid with a cone goal in each corner plus one in the center, 5 goals total. 3v3 or
  4v4. Players try to pass the ball through any goal to a teammate to score in any direction. Defenders
  protect all 5 goals and can only gain possession by intercepting or stealing.
look_for: Attackers must adapt quickly when their path is blocked. Players without the ball must move
  to open space near goals so their teammate has someone to find. Best as a focus activity later in the
  season when combination play is starting to click.
question: When the goal you were aiming for was blocked, what did you do?
